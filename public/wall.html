<style>
/* Hallmark · shape: app screen (wall display) · same system as the viewer (/): tokens, type, radii, status colours and the agent badge are shared with it, not restyled
 * reads at 3 m: the one thing each lane says is the size of the page · states: loading, locked, error, empty (clock), full */
:root {
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --z-base: 1; --z-raised: 10; --z-sticky: 200; --z-drawer: 300; --z-scrim: 250;

  --color-paper: oklch(98.5% 0.004 235);
  --color-paper-2: oklch(96.2% 0.006 235);
  /* 作業の種類ごとの色(白いアイコンを載せても3:1以上になる明度) */
  --k-plan: oklch(50% 0.15 275); --k-think: oklch(50% 0.16 315); --k-search: oklch(52% 0.11 205); --k-read: oklch(52% 0.12 135);
  --k-write: oklch(55% 0.14 60); --k-run: oklch(52% 0.17 28); --k-web: oklch(52% 0.15 245); --k-check: oklch(50% 0.11 170);
  --k-fix: oklch(54% 0.12 95); --k-wait: oklch(54% 0.03 250); --k-note: oklch(55% 0.01 250);
  --color-paper-3: oklch(93.2% 0.008 235);
  --color-ink: oklch(23% 0.02 250);
  --color-ink-2: oklch(40% 0.02 250);
  --color-muted: oklch(47% 0.016 250);
  --color-rule: oklch(90% 0.008 240);
  --color-accent: oklch(50% 0.115 205);
  --color-accent-ink: oklch(98.5% 0.004 235);
  --color-accent-soft: oklch(94.5% 0.035 205);
  --color-focus: oklch(50% 0.115 205);
  --color-success: oklch(48% 0.12 150);
  --color-error: oklch(52% 0.19 27);
  --color-error-soft: oklch(96% 0.03 27);
  --color-warn: oklch(46% 0.12 70);
  --color-warn-soft: oklch(96% 0.05 85);
  --color-warn-rule: oklch(80% 0.12 85);
  --color-av-0: oklch(42% 0.1 205); --color-av-0-bg: oklch(93% 0.04 205);
  --color-av-1: oklch(40% 0.1 150); --color-av-1-bg: oklch(93% 0.04 150);
  --color-av-2: oklch(42% 0.12 40); --color-av-2-bg: oklch(93% 0.04 40);
  --color-av-3: oklch(42% 0.11 300); --color-av-3-bg: oklch(93% 0.04 300);
  --color-av-4: oklch(42% 0.1 85); --color-av-4-bg: oklch(93% 0.05 85);
  --color-av-5: oklch(42% 0.12 350); --color-av-5-bg: oklch(93% 0.04 350);
  --color-glass: color-mix(in oklab, var(--color-paper) 80%, transparent);
  --color-scrim: color-mix(in oklab, var(--color-ink) 38%, transparent);
  --shadow-sheet: 0 10px 20px -12px color-mix(in oklab, var(--color-ink) 38%, transparent);

  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-display: var(--font-body);
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius-card: 12px; --radius-ctl: 8px; --radius-pill: 999px; --rule-hair: 1px;
  --bar-h: 52px; --rail-w: 19rem; --measure: 58rem;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: calc(var(--bar-h) + 140px); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.6; word-break: auto-phrase; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: var(--color-accent); text-decoration-thickness: 1px; text-underline-offset: 0.16em; overflow-wrap: anywhere; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
h1, h2, h3 { font-family: var(--font-display); font-synthesis: none; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { text-wrap: pretty; }
svg { display: block; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spin { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { *:not(.keep-motion), *:not(.keep-motion)::before, *:not(.keep-motion)::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }

.skip { position: absolute; left: var(--space-sm); top: -48px; z-index: var(--z-drawer); padding: var(--space-xs) var(--space-sm); background: var(--color-ink); color: var(--color-paper); border-radius: var(--radius-ctl); }
.skip:focus-visible { top: var(--space-xs); }

.brand { display: flex; align-items: center; gap: var(--space-xs); font-weight: 700; font-size: var(--text-md); letter-spacing: 0; }
.brand .ic { width: 20px; height: 20px; color: var(--color-accent); }
.bar-spacer { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); padding-inline: var(--space-xs); }
.conn[data-state="live"] { color: var(--color-accent); }
.conn[data-state="retry"], .conn[data-state="denied"] { color: var(--color-warn); }

.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--color-ink-2); cursor: pointer; transition: background var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.icon-btn:hover { background: var(--color-paper-3); color: var(--color-ink); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn[aria-pressed="true"] { box-shadow: inset 0 0 0 var(--rule-hair) var(--color-accent); color: var(--color-accent); }
.icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn .ic { width: 20px; height: 20px; }

.av { --av: 20px; position: relative; display: inline-grid; place-items: center; flex: none; width: var(--av); height: var(--av); border-radius: var(--radius-ctl); overflow: hidden; font-size: calc(var(--av) * 0.52); font-weight: 700; line-height: 1; background: var(--color-av-0-bg); color: var(--color-av-0); }
.av[data-t="1"] { background: var(--color-av-1-bg); color: var(--color-av-1); }
.av[data-t="2"] { background: var(--color-av-2-bg); color: var(--color-av-2); }
.av[data-t="3"] { background: var(--color-av-3-bg); color: var(--color-av-3); }
.av[data-t="4"] { background: var(--color-av-4-bg); color: var(--color-av-4); }
.av[data-t="5"] { background: var(--color-av-5-bg); color: var(--color-av-5); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--color-paper); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 40px; padding: 0 var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); color: var(--color-ink); font-size: var(--text-sm); cursor: pointer; transition: background var(--dur-micro), border-color var(--dur-micro), color var(--dur-micro), transform var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-paper-3); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn.primary:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); }
.btn.small { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-xs); }

.field { width: 100%; min-height: 40px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); }
.field:hover { border-color: var(--color-muted); }
.field[aria-invalid="true"] { border-color: var(--color-error); }
.field-error { min-height: 1lh; font-size: var(--text-sm); color: var(--color-error); }
.f-ta, .f-in, .f-sel { width: 100%; padding: var(--space-xs) var(--space-sm); font: inherit; color: inherit; background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); }
.f-in, .f-sel { min-height: 40px; }
.f-ta:hover, .f-in:hover, .f-sel:hover { border-color: var(--color-muted); }
.f-ta:focus-visible, .f-in:focus-visible, .f-sel:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

.runs { display: inline-flex; align-items: center; gap: var(--space-xs); padding-inline: var(--space-sm); min-height: 32px; border-radius: var(--radius-ctl); background: var(--color-accent-soft); color: var(--color-accent); font-size: var(--text-sm); font-weight: 500; }
.runs .num { font-family: var(--font-data); }


/* ---- wall: the viewer's "now" panel, one per AI, sized to be read from across a room ---- */
:root { --gap: clamp(8px, 1.2vmin, 16px); }
html, body { height: 100%; overflow: hidden; }
body { cursor: default; }
body.idle { cursor: none; }
.wall { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--gap); padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right)) max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left)); }
.wbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); min-height: 44px; }
.wbar .brand { margin-right: var(--space-xs); }
.brand small { font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); padding-left: var(--space-sm); border-left: var(--rule-hair) solid var(--color-rule); }
.wbar .runs .ic { color: var(--color-accent); }
.chip-ask { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 32px; padding: 0 var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-warn-soft); color: var(--color-warn); font-size: var(--text-sm); font-weight: 500; }
.chip-ask .num { font-family: var(--font-data); }
.clock { margin-inline: var(--space-xs); font-family: var(--font-data); font-size: clamp(1.1rem, 2.4vmin, 1.6rem); color: var(--color-ink-2); font-variant-numeric: tabular-nums; }
.ctl { display: flex; gap: var(--space-2xs); transition: opacity 0.4s; }
body.idle .ctl:not(:focus-within) { opacity: 0; pointer-events: none; }
a.icon-btn { text-decoration: none; }

/* ---- lanes grid ---- */
.grid { display: grid; gap: var(--gap); min-height: 0; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr)); }
.lane { position: relative; container-type: size; display: flex; flex-direction: column; gap: 2cqh; min-height: 0; padding: clamp(12px, 3cqmin, 36px); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); overflow: hidden; transition: border-color var(--dur-micro); }
.lane[data-st="running"] { border-color: var(--color-accent); box-shadow: var(--shadow-sheet); }
.lane[data-st="done"] { border-color: var(--color-success); background: var(--color-paper-2); }
.lane[data-st="failed"] { border-color: var(--color-error); background: var(--color-paper-2); }
.lane[data-st="cancelled"] { background: var(--color-paper-2); }
.lane[data-stale="1"] { border-color: var(--color-warn-rule); box-shadow: none; }
.who { display: flex; align-items: center; gap: 1.6cqmin; min-width: 0; }
.who .av { --av: clamp(28px, 7cqmin, 64px); }
.who-t { min-width: 0; flex: 1; }
.who-n { display: flex; align-items: center; gap: 1cqmin; min-width: 0; font-size: clamp(0.875rem, 3.4cqmin, 1.5rem); line-height: 1.3; }
.who-n .no { flex: none; min-width: 2.2ch; padding: 0 0.5em; border-radius: var(--radius-ctl); background: var(--color-av-0-bg); color: var(--color-av-0); font-size: 0.72em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.6; text-align: center; }
.who-n .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-m { font-size: clamp(0.6875rem, 2.4cqmin, 1rem); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { flex: none; display: inline-flex; align-items: center; gap: 0.8cqmin; font-size: clamp(0.75rem, 2.6cqmin, 1.1rem); font-weight: 500; color: var(--color-muted); }
.st .dot { width: 0.7em; height: 0.7em; border-radius: var(--radius-pill); background: currentColor; }
.lane[data-st="running"] .st { color: var(--color-accent); }
.lane[data-st="running"] .st .dot { animation: pulse 1.6s ease-in-out infinite; }
.lane[data-st="done"] .st { color: var(--color-success); }
.lane[data-st="failed"] .st { color: var(--color-error); }
.lane[data-stale="1"] .st { color: var(--color-warn); }
.lane[data-stale="1"] .st .dot { animation: none; }
.lane[data-t="0"] .no { background: var(--color-av-0-bg); color: var(--color-av-0); }
.lane[data-t="1"] .no { background: var(--color-av-1-bg); color: var(--color-av-1); }
.lane[data-t="2"] .no { background: var(--color-av-2-bg); color: var(--color-av-2); }
.lane[data-t="3"] .no { background: var(--color-av-3-bg); color: var(--color-av-3); }
.lane[data-t="4"] .no { background: var(--color-av-4-bg); color: var(--color-av-4); }
.lane[data-t="5"] .no { background: var(--color-av-5-bg); color: var(--color-av-5); }
.title { font-size: clamp(1rem, 4.2cqmin, 2rem); font-weight: 700; line-height: 1.3; color: var(--color-ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.now { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 1cqmin; overflow: hidden; }
.now-l { font-size: clamp(0.6875rem, 2.4cqmin, 1rem); color: var(--color-muted); }
.now-t { font-size: clamp(1.25rem, 8.5cqmin, 4.5rem); font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
.lane[data-st="done"] .now-t, .lane[data-st="cancelled"] .now-t { color: var(--color-ink-2); }
.next { font-size: clamp(0.75rem, 2.8cqmin, 1.2rem); color: var(--color-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next b { font-weight: 700; color: var(--color-muted); }
.prog { height: clamp(6px, 1cqmin, 12px); border-radius: var(--radius-pill); background: var(--color-paper-3); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; border-radius: var(--radius-pill); background: var(--color-accent); transform-origin: left; }
.lane[data-st="failed"] .prog i { background: var(--color-error); }
.lane[data-st="done"] .prog i { background: var(--color-success); }
.meta { display: flex; justify-content: space-between; gap: var(--space-md); font-family: var(--font-data); font-size: clamp(0.6875rem, 2.4cqmin, 1rem); color: var(--color-muted); }
.steps { display: flex; flex-direction: column; gap: 0.8cqmin; min-height: 0; margin: 0; padding: 0; list-style: none; overflow: hidden; }
.steps li { display: flex; align-items: center; gap: 1.2cqmin; font-size: clamp(0.6875rem, 2.5cqmin, 1.05rem); color: var(--color-muted); min-width: 0; }
.steps li .ic { width: 1.1em; height: 1.1em; color: var(--color-muted); }
.steps li[data-k="plan"] .ic { color: var(--k-plan); }
.steps li[data-k="think"] .ic { color: var(--k-think); }
.steps li[data-k="search"] .ic { color: var(--k-search); }
.steps li[data-k="read"] .ic { color: var(--k-read); }
.steps li[data-k="write"] .ic { color: var(--k-write); }
.steps li[data-k="run"] .ic { color: var(--k-run); }
.steps li[data-k="web"] .ic { color: var(--k-web); }
.steps li[data-k="check"] .ic { color: var(--k-check); }
.steps li[data-k="fix"] .ic { color: var(--k-fix); }
.steps li[data-k="wait"] .ic { color: var(--k-wait); }
.steps li[data-k="note"] .ic { color: var(--k-note); }
.steps li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li[data-s="running"] { color: var(--color-ink); font-weight: 500; }
.steps li[data-s="failed"] { color: var(--color-error); }
.steps li[data-s="failed"] .ic { color: var(--color-error); }
@container (max-height: 360px) { .steps, .next { display: none; } }
@container (max-height: 260px) { .title { display: none; } }
.ask-b { display: flex; align-items: flex-start; gap: 1.4cqmin; padding: 1.4cqmin 2cqmin; border: var(--rule-hair) solid var(--color-warn-rule); border-radius: var(--radius-ctl); background: var(--color-warn-soft); color: var(--color-warn); font-size: clamp(0.8125rem, 3cqmin, 1.4rem); font-weight: 500; line-height: 1.4; }
.ask-b .ic { flex: none; margin-top: 0.2em; width: 1.2em; height: 1.2em; }
.ask-b span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* ---- empty / state ---- */
.empty { display: grid; place-content: center; justify-items: center; gap: var(--space-lg); text-align: center; padding: var(--space-lg); }
.empty .big { font-family: var(--font-data); font-size: clamp(3rem, 20vmin, 14rem); font-weight: 500; line-height: 1; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.empty p { color: var(--color-ink-2); font-size: clamp(0.9375rem, 2.6vmin, 1.5rem); max-width: 40ch; }
.empty h2 { margin: 0; font-size: clamp(1.4rem, 4vmin, 2.4rem); font-weight: 700; }
.recent { width: min(60ch, 90vw); margin: 0; padding: var(--space-xs); list-style: none; display: flex; flex-direction: column; gap: var(--space-3xs); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper-2); }
.recent li { display: flex; align-items: baseline; gap: var(--space-md); padding: var(--space-sm); border-radius: var(--radius-ctl); text-align: left; font-size: clamp(0.8125rem, 2.2vmin, 1.2rem); }
.recent li .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.recent li .m { font-size: 0.8em; color: var(--color-muted); }
.recent li .s { font-size: 0.8em; font-weight: 500; color: var(--color-success); }
.recent li[data-st="failed"] .s { color: var(--color-error); }
.recent li[data-st="cancelled"] .s { color: var(--color-muted); }
.form { display: grid; gap: var(--space-sm); justify-items: stretch; width: min(24rem, 86vw); }

/* ---- ticker: the latest note from an AI ---- */
.tick { display: flex; align-items: center; gap: var(--space-sm); min-height: 36px; padding: 0 var(--space-md); border-radius: var(--radius-ctl); background: var(--color-paper-2); font-size: clamp(0.8125rem, 2vmin, 1.1rem); color: var(--color-ink-2); overflow: hidden; }
.tick .ic { color: var(--color-muted); }
.tick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tick b { font-weight: 700; color: var(--color-ink); }

@media (max-width: 40rem) {
  .brand small { display: none; }
  .clock { font-size: 1rem; }
  .grid { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; grid-auto-rows: minmax(21rem, 1fr); overflow-y: auto; }

function tickTime(l) { $('.m-time', l.el).textContent = fmtDur((l.until || nowMs()) - l.since); }

  grid.innerHTML = ''; S.lanes.clear();
  const d = document.createElement('section'); d.className = 'empty';
  d.innerHTML = `<h2>閲覧トークンが必要です</h2><p>ビューアーと同じトークンを入れると、この画面にも表示されます。</p><form class="form" id="tokForm"><input class="field" id="tokIn" type="password" autocomplete="off" aria-label="閲覧トークン" placeholder="閲覧トークン"><button class="btn primary" type="submit">表示する</button></form>`;
  grid.appendChild(d);
  $('#tokForm').addEventListener('submit', (e) => { e.preventDefault(); S.token = $('#tokIn').value.trim(); store.set('token', S.token); boot(); });
  $('#tokIn').focus();
}
function renderTick() {
  const n = S.notes.find((x) => x.from !== 'user'), t = $('#tick');
  t.hidden = !n; if (n) $('#tickT').innerHTML = `<b>${esc(agentName(n.from))}</b> ${esc(String(n.body).replace(/\s+/g, ' ').slice(0, 160))}`;
}

/* ---------- clock, timers, burn-in shift ---------- */
const clockStr = (sec) => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}${sec ? '' : ':' + p(d.getSeconds())}`; };
setInterval(() => {
  $('#clock').textContent = clockStr(false); const b = $('#bigClock'); if (b) b.textContent = clockStr(true);
  for (const [, l] of S.lanes) tickTime(l);
  for (const [id, l] of S.lanes) { const t = S.tasks.get(l.taskId); if (t && t.status === 'running') { const stale = nowMs() - t.updatedAt > STALE_MS; if ((l.el.dataset.stale === '1') !== stale) render(); } }
}, 1000);
$('#clock').textContent = clockStr(false);
// 焼き付き防止に、3分ごとに数pxずらす。ただし余白が左右非対称に見えるので、全画面/アプリ表示の広い画面(壁掛け用途)でだけ行う
const canShift = () => innerWidth > 640 && (fsOn() || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
const shiftWall = () => { const w = $('#wall'); if (!canShift()) { w.style.transform = ''; return; } const dx = Math.round((Math.random() - 0.5) * 12), dy = Math.round((Math.random() - 0.5) * 12); w.style.transform = `translate(${dx}px, ${dy}px)`; };
setInterval(shiftWall, 180000);
['resize', 'fullscreenchange'].forEach((e) => addEventListener(e, () => { if (!canShift()) $('#wall').style.transform = ''; }));

let idleT = 0; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 4000); };
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach((e) => addEventListener(e, wake, { passive: true })); wake();
addEventListener('resize', () => { if (S.lanes.size) layout(S.lanes.size); });

/* ---------- fullscreen, wake lock ---------- */
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
async function toggleFull() { try { if (fsOn()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document); else await (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); } catch {} }
document.addEventListener('fullscreenchange', () => { $('#bFull').setAttribute('aria-label', fsOn() ? '全画面を終了' : '全画面にする'); setTimeout(() => S.lanes.size && layout(S.lanes.size), 100); });
$('#bFull').addEventListener('click', toggleFull); if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) $('#bFull').hidden = true;
let lock = null;
async function setAwake(on) {
  S.awake = on; store.set('wall.awake', on ? '1' : '0');
  try { if (on && 'wakeLock' in navigator) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } else if (lock) { await lock.release(); lock = null; } } catch { S.awake = false; }
  $('#bAwake').setAttribute('aria-pressed', S.awake ? 'true' : 'false');
}
if (!('wakeLock' in navigator)) $('#bAwake').hidden = true;
$('#bAwake').addEventListener('click', () => setAwake(!S.awake));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.awake && !lock) setAwake(true); });
addEventListener('keydown', (e) => { if (e.target.closest('input')) return; if (e.key === 'f' || e.key === 'F') toggleFull(); else if (e.key === 'w' || e.key === 'W') setAwake(!S.awake); });

addEventListener('DOMContentLoaded', () => { if (window.WLNotify) WLNotify.mount({ before: '#bAwake', cls: 'icon-btn' }); });
addEventListener('load', () => { if (window.WLNotify && !document.getElementById('wlnBtn')) WLNotify.mount({ before: '#bAwake', cls: 'icon-btn' }); });
const u = new URL(location.href); const qt = u.searchParams.get('token'); if (qt) { S.token = qt; store.set('token', qt); u.searchParams.delete('token'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
if (S.awake) setAwake(true);
draw(); boot();
</script>
</body>
</html>
