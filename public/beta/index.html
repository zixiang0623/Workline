/* ---- shell ---- */

.srow { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 0 var(--space-sm); width: 100%; padding: var(--space-sm) var(--space-md) var(--space-sm) calc(var(--space-md) + var(--space-xs)); border: 0; border-bottom: var(--rule-hair) solid var(--color-rule-2); background: transparent; color: inherit; text-align: left; cursor: pointer; transition: background-color var(--dur-micro) var(--ease-out); }

<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n) => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const linkify = (t) => esc(t).replace(/https?:\/\/[^\s<>"]+/g, (u) => { const m = u.match(/[.,;:!?)\]」』、。]+$/); const tail = m ? m[0] : ''; const url = tail ? u.slice(0, -tail.length) : u; return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`; });
const p2 = (n) => String(n).padStart(2, '0');
const hms = (ms) => { const d = new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
const hm = (ms) => { const d = new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}:${p2(m)}:${p2(s % 60)}` : `${p2(m)}:${p2(s % 60)}`; };
const ago = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); if (s < 5) return 'いま'; if (s < 60) return `${s}秒前`; if (s < 3600) return `${Math.floor(s / 60)}分前`; if (s < 86400) return `${Math.floor(s / 3600)}時間前`; return `${Math.floor(s / 86400)}日前`; };
const ZONE = (() => { try { return new Intl.DateTimeFormat('ja-JP', { timeZoneName: 'short' }).formatToParts(new Date()).find((p) => p.type === 'timeZoneName').value; } catch { return ''; } })();
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const motion = () => !reduced() && typeof window.gsap !== 'undefined';
const store = {
  get(k, d) { try { const v = localStorage.getItem('workline.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('workline.' + k, v); } catch {} },
};
const ms = (v) => (v ? Date.parse(v) : null);

const KIND = { plan: ['計画', 'list-checks'], think: ['考える', 'brain'], search: ['検索', 'search'], read: ['読む', 'book-open'], write: ['編集', 'pencil-line'], run: ['実行', 'terminal'], web: ['通信', 'globe'], check: ['確認', 'circle-check'], fix: ['修正', 'wrench'], wait: ['待機', 'hourglass'], note: ['メモ', 'message-square-text'] };
const TASK_ST = { running: ['実行中', 'activity'], done: ['完了', 'circle-check'], failed: ['失敗', 'circle-x'], cancelled: ['中断', 'ban'] };
const STEP_ST = { running: ['実行中', 'activity'], done: ['完了', 'check'], failed: ['失敗', 'circle-x'], skipped: ['スキップ', 'circle-minus'] };
const PLAN_ST = { planned: 'circle-dashed', running: 'activity', done: 'circle-check', failed: 'circle-x', skipped: 'circle-minus' };
const DST = { posted: ['未受領', 'inbox'], accepted: ['作業中', 'activity'], done: ['完了', 'circle-check'], failed: ['失敗', 'circle-x'], rejected: ['辞退', 'ban'] };
const KIND_L = { directive: '司令', request: '要求' };
const URG = { low: '緊急度 低', high: '緊急度 高', urgent: '至急' };
const RISK = { low: '低リスク', medium: '中リスク', high: '高リスク' };

/* ================= state ================= */
const S = {
  tasks: new Map(), agents: new Map(), dirs: new Map(), msgs: new Map(), notes: new Map(), approvals: new Map(),
  sel: null, tab: ['work', 'dir', 'note', 'req'].includes(store.get('beta.tab', 'work')) ? store.get('beta.tab', 'work') : 'work',
  follow: store.get('beta.follow', '1') === '1', filter: '', scope: store.get('beta.scope', 'all'), newest: store.get('beta.order', 'new') === 'new',
  conn: 'connecting', offset: 0, auth: null, token: store.get('token', ''), sound: store.get('beta.sound', '0') === '1', booted: false,
  shots: new Map(), pend: { note: [], req: [] }, exp: new Set(), dirFilter: 'all', noteFilter: 'all', rcp: new Set(), replyTo: null, seen: new Set(), maxId: 0, showAll: false, iconRev: 0,
};
try { const u = new URL(location.href), t = u.searchParams.get('token'); if (t) { S.token = t; store.set('token', t); u.searchParams.delete('token'); history.replaceState(null, '', u.pathname + (u.search || '') + u.hash); } } catch {}
const nowMs = () => Date.now() + S.offset;
const authHeaders = () => (S.token ? { authorization: 'Bearer ' + S.token } : {});
const tintOf = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 6; };
const agentOf = (id) => S.agents.get(id) || { id, name: id === 'user' ? 'あなた' : id || '不明なAI', model: '', domain: '', hasIcon: false };
const whoName = (id) => (id === 'user' ? 'あなた' : agentOf(id).name);
function avatar(id, size = 18) {
  if (id === 'user') return `<span class="av" style="--av:${size}px" aria-hidden="true">${icon('user')}</span>`;
  const a = agentOf(id), src = `/api/icon?agent=${encodeURIComponent(a.id)}${S.iconRev ? '&v=' + S.iconRev : ''}${S.token ? '&token=' + encodeURIComponent(S.token) : ''}`;
  return `<span class="av" style="--av:${size}px" aria-hidden="true"><span>${esc([...a.name][0] || '?')}</span>${a.hasIcon ? `<img src="${src}" alt="" loading="lazy" decoding="async">` : ''}</span>`;
}
document.addEventListener('error', (e) => { const t = e.target; if (t && t.tagName === 'IMG' && t.closest('.av')) t.remove(); }, true);
const shotSrc = (id) => `/api/shot?id=${id}${S.token ? '&token=' + encodeURIComponent(S.token) : ''}`;
const shotsOf = (col, id) => [...S.shots.values()].filter((s) => s[col] === id).sort((a, b) => a.shotId - b.shotId);
const thumbs = (list) => (list.length ? `<div class="thumbs">${list.map((s, i) => `<button class="thumb" type="button" data-shot="${s.shotId}" data-group="${list.map((x) => x.shotId).join(',')}" aria-label="スクリーンショット ${i + 1}/${list.length} を開く${s.caption ? ': ' + esc(s.caption) : ''}"><img src="${shotSrc(s.shotId)}" alt="${esc(s.caption || 'スクリーンショット')}" loading="lazy" decoding="async"></button>`).join('')}</div>` : '');
const isRoot = (t) => t.parentId == null;
const matches = (t) => !S.filter || t.agent === S.filter;
const treeOf = (rid) => [...S.tasks.values()].filter((x) => x.rootId === rid).sort((a, b) => a.agentNo - b.agentNo || a.id - b.id);
const isDesc = (x, rootId) => { let c = x; for (let i = 0; c && i < 8; i++) { if (c.parentId === rootId) return true; c = S.tasks.get(c.parentId); } return false; };
const scopeIds = (t) => { const ids = new Set([t.id]); for (const x of S.tasks.values()) if (isDesc(x, t.id)) ids.add(x.id); return ids; };

/* ================= sound (off by default) ================= */
let actx = null, lastTick = 0;
function beep(freq, dur, type = 'sine', gain = 0.035, delay = 0, to = 0) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch {}
}
const sfx = {
  step() { const n = performance.now(); if (n - lastTick < 140) return; lastTick = n; beep(520, 0.09, 'sine', 0.035, 0, 360); },
  done() { beep(659, 0.18, 'sine', 0.04); beep(988, 0.3, 'sine', 0.035, 0.09); },
  fail() { beep(190, 0.32, 'triangle', 0.05, 0, 130); },

/* ================= connection ================= */
const CONN = { live: ['wifi', 'ライブ'], connecting: ['loader', '接続中'], retry: ['wifi-off', '再接続中'], denied: ['lock', 'トークンが必要'] };
function setConn(s) { S.conn = s; const c = $('#conn'); c.dataset.state = s; c.innerHTML = `${icon(CONN[s][0])}<span>${CONN[s][1]}</span>`; }
let ws = null, backoff = 1000, pingTimer = 0, lastPong = 0, pollTimer = 0, retryTimer = 0;
async function fetchSnapshot() {
  const r = await fetch('/api/snapshot', { cache: 'no-store', headers: authHeaders() });
  if (r.status === 401) { const e = new Error('denied'); e.denied = true; throw e; }
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
function showState(k) {
  for (const id of ['stLoading', 'stEmpty', 'stError', 'stLocked']) $('#' + id).hidden = id !== k;
  $('#task').hidden = k !== null;
}
async function boot() {
  setConn('connecting');
  if (!S.booted) showState('stLoading');
  try { handle(await fetchSnapshot(), true); S.booted = true; connect(); }
  catch (e) {
    if (e.denied) { setConn('denied'); showState('stLocked'); $('#tokenIn').focus(); return; }
    setConn('retry'); if (!S.booted) showState('stError');
    clearTimeout(retryTimer); retryTimer = setTimeout(boot, Math.min(backoff *= 2, 15000));
  }
}
function connect() {
  clearTimeout(retryTimer);
  try { ws && ws.close(); } catch {}
  const q = S.token ? `?token=${encodeURIComponent(S.token)}` : '';
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws${q}`);
  const mine = ws;
  ws.onopen = () => {
    backoff = 1000; lastPong = Date.now(); setConn('live'); clearInterval(pollTimer); pollTimer = 0; clearInterval(pingTimer);
    pingTimer = setInterval(() => { if (Date.now() - lastPong > 60000) { try { mine.close(); } catch {} return; } try { mine.send('ping'); } catch {} }, 25000);
  };
  ws.onmessage = (e) => { if (e.data === 'pong') { lastPong = Date.now(); return; } try { const j = JSON.parse(e.data); handle(j, j.t === 'snapshot'); window.WLNotify && WLNotify.onMessage(j); } catch (err) { console.error(err); } };
  ws.onclose = () => {
    if (mine !== ws) return;
    clearInterval(pingTimer); if (S.conn !== 'denied') setConn('retry');
    if (!pollTimer) pollTimer = setInterval(async () => { try { handle(await fetchSnapshot(), true); } catch {} }, 5000);
    clearTimeout(retryTimer); retryTimer = setTimeout(connect, backoff = Math.min(backoff * 2, 15000));
  };
  ws.onerror = () => {};
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.booted && (!ws || ws.readyState > 1)) { backoff = 1000; connect(); } });
$('#retryBtn').addEventListener('click', () => { backoff = 1000; boot(); });
$('#tokenForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#tokenIn').value.trim(); if (!v) return; S.token = v; store.set('token', v); $('#tokenSt').textContent = '確認しています'; boot(); });

/* ================= data ================= */
function upsertTask(t) {
  let cur = S.tasks.get(t.id);
  if (!cur) { cur = { steps: new Map(), order: [] }; S.tasks.set(t.id, cur); }
  const { steps, ...rest } = t; Object.assign(cur, rest); return cur;
}
function upsertStep(s) {
  const t = S.tasks.get(s.taskId); if (!t) return null;
  const isNew = !t.steps.has(s.id); t.steps.set(s.id, s); if (isNew) t.order.push(s.id);
  return { t, isNew };
}
function handle(msg, quiet = false) {
  if (msg.t === 'shot') { S.shots.set(msg.shot.shotId, msg.shot); sigs.work = sigs.dir = sigs.req = sigs.note = ''; renderComms(); return; }
  if (msg.t === 'purged') { for (const m of [S.tasks, S.dirs, S.msgs, S.notes, S.approvals, S.shots]) m.clear(); S.sel = null; S.seen.clear(); renderAll(); showState('stEmpty'); return; }
  if (msg.t === 'directive') { S.dirs.set(msg.directive.directiveId, msg.directive); renderComms(); return; }
  if (msg.t === 'note') { S.notes.set(msg.note.noteId, msg.note); renderComms(); return; }
  if (msg.t === 'message') { if (msg.message.control) S.msgs.set(msg.message.messageId, msg.message); renderComms(); return; }
  if (msg.t === 'message-acked') { for (const id of msg.ids || []) { const x = S.msgs.get(id); if (x) x.status = 'acked'; } reloadNotes(); renderComms(); return; }
  if (msg.t === 'stop-cleared') { for (const x of S.msgs.values()) if (x.control && x.taskId === msg.taskId) x.status = 'acked'; renderComms(); return; }
  if (msg.t === 'approval') { const had = S.approvals.has(msg.approval.requestId); S.approvals.set(msg.approval.requestId, msg.approval); if (!had && msg.approval.status === 'pending') sfx.ask(); renderAppr(); return; }
  if (msg.t === 'snapshot') {
    S.offset = msg.serverTime - Date.now(); S.auth = msg.auth;
    for (const a of msg.agents || []) S.agents.set(a.id, a);
    for (const d of msg.directives || []) S.dirs.set(d.directiveId, d);
    for (const x of msg.messages || []) S.msgs.set(x.messageId, x);
    for (const n of msg.notes || []) S.notes.set(n.noteId, n);
    for (const x of msg.shots || []) S.shots.set(x.shotId, x);
    S.approvals = new Map((msg.approvals || []).map((a) => [a.requestId, a]));
    const prev = latestRoot();
    for (const raw of [...msg.tasks].reverse()) {
      const t = upsertTask(raw); const known = new Set(t.order);
      for (const s of raw.steps || []) { if (!known.has(s.id)) upsertStep(s); else t.steps.set(s.id, s); }
      S.maxId = Math.max(S.maxId, raw.id);
    }
    if (!S.tasks.size) { renderAll(); renderAppr(); showState('stEmpty'); return; }
    showState(null);
    if (S.sel === null || !S.tasks.has(S.sel)) {
      const h = hashState(); select(S.tasks.has(h.t) ? h.t : latestRoot() || S.maxId, { tab: h.tab });
    } else if (S.follow && latestRoot() > prev) select(latestRoot());
    else renderAll(quiet);
    renderAppr();
    return;
  }
  if (msg.t !== 'patch') return;
  const prevStatus = S.tasks.get(msg.task.id)?.status, wasLatest = latestRoot();
  if (msg.agent) S.agents.set(msg.agent.id, msg.agent);
  const t = upsertTask(msg.task); S.maxId = Math.max(S.maxId, t.id);
  const fresh = [];
  for (const s of msg.steps || []) { const r = upsertStep(s); if (r && r.isNew) fresh.push(s.id); }
  if (S.sound) { if (prevStatus === 'running' && t.status === 'done') sfx.done(); else if (prevStatus === 'running' && (t.status === 'failed' || t.status === 'cancelled')) sfx.fail(); else if (fresh.length) sfx.step(); }
  if (S.tasks.size && $('#task').hidden) showState(null);
  if ((isRoot(t) && matches(t) && t.id > wasLatest && S.follow) || S.sel === null) { select(t.id); return; }
  renderAll();
}
async function reloadNotes() { clearTimeout(reloadNotes.t); reloadNotes.t = setTimeout(async () => { try { const j = await fetchSnapshot(); for (const n of j.notes || []) S.notes.set(n.noteId, n); renderComms(); } catch {} }, 700); }

function hashState() { const h = new URLSearchParams(location.hash.replace(/^#/, '')); const t = Number(h.get('t')); return { t: Number.isFinite(t) && t > 0 ? t : null, tab: ['work', 'dir', 'note', 'req'].includes(h.get('tab')) ? h.get('tab') : null }; }

/* ================= work tab ================= */

}

$('#lightbox').addEventListener('click', (e) => { if (e.target === $('#lightbox')) $('#lightbox').close(); });
$('#lightbox').addEventListener('keydown', (e) => { if (lbGroup.length > 1 && e.key === 'ArrowRight') { $('#lbNext').click(); } else if (lbGroup.length > 1 && e.key === 'ArrowLeft') { $('#lbPrev').click(); } });
$('#lightbox').addEventListener('close', () => { $('#lbImg').removeAttribute('src'); if (lbOpener && lbOpener.isConnected) lbOpener.focus(); });

/* ================= live clocks (once a second) ================= */
setInterval(() => {
  const n = nowMs();
  for (const el of $$('[data-live]')) {
    const k = el.dataset.live, t0 = Number(el.dataset.t0), t1 = Number(el.dataset.t1);
    if (k === 'el') el.textContent = clock(n - t0); else if (k === 'fix') el.textContent = clock((t1 || n) - t0); else if (k === 'ago') el.textContent = ago(n - t0); else if (k === 'rem') el.textContent = '残り ' + clock(Math.max(0, t1 - n));
  }
  const t = S.tasks.get(S.sel); if (t && t.status === 'running') { sigs.work = (S.tab === 'work' && Math.floor(n / 15000) !== Math.floor((n - 1000) / 15000)) ? '' : sigs.work; if (!sigs.work) renderComms(); }
}, 1000);

/* ================= start ================= */
applySound(); setConn('connecting'); applyTab();
{ const h = hashState(); if (h.tab) S.tab = h.tab; applyTab(); }
boot();

</script>
<script>addEventListener('load', () => { if (window.WLNotify) WLNotify.mount({ before: '#soundBtn', cls: 'btn quiet' }); });</script>
