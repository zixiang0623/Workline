<head>

<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom
 * paper: oklch(98.5% 0.004 235) · accent: oklch(50% 0.115 205) · display: Zen Kaku Gothic New · body: Zen Kaku Gothic New
 * nav: task rail beside the log, a drawer under 60rem · signature: the live ledger, a timeline with a pinned now panel · states: loading, empty, locked, error, full
 * axes: cool white/one family/teal · posture: working tool, watched for hours · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: S, one radius per nesting level and the pinned now panel carries the weight instead of extra cards */
:root {
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --z-base: 1; --z-raised: 10; --z-sticky: 200; --z-drawer: 300; --z-scrim: 250;

  --color-paper: oklch(98.5% 0.004 235);
  --color-paper-2: oklch(96.2% 0.006 235);
  --color-paper-3: oklch(93.2% 0.008 235);
  --color-ink: oklch(23% 0.02 250);
  --color-ink-2: oklch(40% 0.02 250);
  --color-muted: oklch(47% 0.016 250);
  --color-rule: oklch(90% 0.008 240);
  --color-accent: oklch(50% 0.115 205);
  --color-accent-ink: oklch(98.5% 0.004 235);
  --color-accent-soft: oklch(94.5% 0.035 205);
  --color-focus: oklch(50% 0.115 205);
  --color-success: oklch(48% 0.12 150);
  --color-error: oklch(52% 0.19 27);
  --color-error-soft: oklch(96% 0.03 27);
  --color-warn: oklch(46% 0.12 70);
  --color-warn-soft: oklch(96% 0.05 85);
  --color-warn-rule: oklch(80% 0.12 85);
  --color-av-0: oklch(42% 0.1 205); --color-av-0-bg: oklch(93% 0.04 205);
  --color-av-1: oklch(40% 0.1 150); --color-av-1-bg: oklch(93% 0.04 150);
  --color-av-2: oklch(42% 0.12 40); --color-av-2-bg: oklch(93% 0.04 40);
  --color-av-3: oklch(42% 0.11 300); --color-av-3-bg: oklch(93% 0.04 300);
  --color-av-4: oklch(42% 0.1 85); --color-av-4-bg: oklch(93% 0.05 85);
  --color-av-5: oklch(42% 0.12 350); --color-av-5-bg: oklch(93% 0.04 350);
  --color-glass: color-mix(in oklab, var(--color-paper) 80%, transparent);
  --color-scrim: color-mix(in oklab, var(--color-ink) 38%, transparent);
  --shadow-sheet: 0 10px 20px -12px color-mix(in oklab, var(--color-ink) 38%, transparent);

  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-display: var(--font-body);
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius-card: 12px; --radius-ctl: 8px; --radius-pill: 999px; --rule-hair: 1px;
  --bar-h: 52px; --rail-w: 19rem; --measure: 58rem;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: calc(var(--bar-h) + 140px); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.6; word-break: auto-phrase; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: var(--color-accent); text-decoration-thickness: 1px; text-underline-offset: 0.16em; overflow-wrap: anywhere; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
h1, h2, h3 { font-family: var(--font-display); font-synthesis: none; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { text-wrap: pretty; }
svg { display: block; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spin { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { *:not(.keep-motion), *:not(.keep-motion)::before, *:not(.keep-motion)::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }

.skip { position: absolute; left: var(--space-sm); top: -48px; z-index: var(--z-drawer); padding: var(--space-xs) var(--space-sm); background: var(--color-ink); color: var(--color-paper); border-radius: var(--radius-ctl); }
.skip:focus-visible { top: var(--space-xs); }

/* ---- top bar ---- */
.bar { position: sticky; top: 0; z-index: var(--z-sticky); height: var(--bar-h); display: flex; align-items: center; gap: var(--space-xs); padding-inline: var(--space-md); background: var(--color-glass); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border-bottom: var(--rule-hair) solid var(--color-rule); }
.brand { display: flex; align-items: center; gap: var(--space-xs); font-weight: 700; font-size: var(--text-md); letter-spacing: 0; }
.brand .ic { width: 20px; height: 20px; color: var(--color-accent); }
.bar-spacer { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); padding-inline: var(--space-xs); }
.conn[data-state="live"] { color: var(--color-accent); }
.conn[data-state="retry"], .conn[data-state="denied"] { color: var(--color-warn); }

.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--color-ink-2); cursor: pointer; transition: background var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.icon-btn:hover { background: var(--color-paper-3); color: var(--color-ink); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn[aria-pressed="true"] { box-shadow: inset 0 0 0 var(--rule-hair) var(--color-accent); color: var(--color-accent); }
.icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn .ic { width: 20px; height: 20px; }
.menu-btn { display: none; margin-left: calc(var(--space-xs) * -1); }

/* ---- shell ---- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); align-items: start; }
.rail { position: sticky; top: var(--bar-h); height: calc(100dvh - var(--bar-h)); overflow: auto; display: flex; flex-direction: column; background: var(--color-paper-2); border-right: var(--rule-hair) solid var(--color-rule); }
.rail-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-xs); padding: var(--space-md) var(--space-md) var(--space-xs); }
.rail-head h2 { font-size: var(--text-sm); font-weight: 700; color: var(--color-ink-2); }
.chip { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 32px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-paper); color: var(--color-ink-2); font-size: var(--text-xs); cursor: pointer; transition: background var(--dur-micro), color var(--dur-micro), transform var(--dur-micro) var(--ease-out); }
.chip:hover { background: var(--color-paper-3); }
.chip:active { transform: scale(0.96); }
.chip[aria-pressed="true"] { background: var(--color-accent-soft); border-color: var(--color-accent); color: var(--color-accent); }
.tasklist { list-style: none; display: flex; flex-direction: column; gap: var(--space-3xs); padding: var(--space-xs); flex: 1; }
.trow { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--space-xs); align-items: start; width: 100%; min-height: 48px; padding: var(--space-sm); border: 0; border-radius: var(--radius-ctl); background: transparent; text-align: left; cursor: pointer; transition: background var(--dur-micro), transform var(--dur-micro) var(--ease-out); }
.trow:hover { background: var(--color-paper-3); }
.trow:active { transform: scale(0.985); }
.trow[aria-current="true"] { background: var(--color-paper); box-shadow: 0 0 0 var(--rule-hair) var(--color-rule); }
.trow-ic { padding-top: var(--space-2xs); color: var(--color-muted); }
.trow[data-status="running"] .trow-ic { color: var(--color-accent); }
.trow[data-status="done"] .trow-ic { color: var(--color-success); }
.trow[data-status="failed"] .trow-ic { color: var(--color-error); }
.trow-main { display: flex; flex-direction: column; min-width: 0; }
.trow-title { font-size: var(--text-sm); font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.trow-meta { display: flex; justify-content: space-between; gap: var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }
.rail-foot { display: flex; flex-direction: column; gap: var(--space-xs); padding: var(--space-sm) var(--space-md) var(--space-md); border-top: var(--rule-hair) solid var(--color-rule); }
.rail-note { display: flex; gap: var(--space-xs); align-items: flex-start; font-size: var(--text-xs); color: var(--color-warn); }
.rail-note .ic { margin-top: var(--space-2xs); }
.scrim { position: fixed; inset: 0; z-index: var(--z-scrim); background: var(--color-scrim); opacity: 0; }

/* ---- agents (which AI is working) ---- */
.av { --av: 20px; position: relative; display: inline-grid; place-items: center; flex: none; width: var(--av); height: var(--av); border-radius: var(--radius-ctl); overflow: hidden; font-size: calc(var(--av) * 0.52); font-weight: 700; line-height: 1; background: var(--color-av-0-bg); color: var(--color-av-0); }
.av[data-t="1"] { background: var(--color-av-1-bg); color: var(--color-av-1); }
.av[data-t="2"] { background: var(--color-av-2-bg); color: var(--color-av-2); }
.av[data-t="3"] { background: var(--color-av-3-bg); color: var(--color-av-3); }
.av[data-t="4"] { background: var(--color-av-4-bg); color: var(--color-av-4); }
.av[data-t="5"] { background: var(--color-av-5-bg); color: var(--color-av-5); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--color-paper); }
.by { display: inline-flex; align-items: center; gap: var(--space-xs); min-width: 0; font-size: var(--text-sm); }
.by-name { font-weight: 700; }
.by-model { color: var(--color-muted); font-size: var(--text-xs); overflow-wrap: anywhere; }
.head-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-md); }
.s-by { display: inline-flex; align-items: center; gap: var(--space-2xs); color: var(--color-ink-2); }
.agent-filter { display: flex; flex-wrap: wrap; gap: var(--space-xs); padding: 0 var(--space-md) var(--space-xs); }
.agent-filter .num { font-family: var(--font-data); }
.trow-meta { align-items: center; }
.trow-when { flex: none; font-family: var(--font-data); }
.trow[data-status="running"] .trow-when { color: var(--color-accent); }
.trow[data-stale] .trow-ic, .trow[data-stale] .trow-when { color: var(--color-warn); }
.trow-by { display: inline-flex; align-items: center; gap: var(--space-2xs); min-width: 0; color: var(--color-ink-2); }

/* ---- buttons / fields ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 40px; padding: 0 var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); color: var(--color-ink); font-size: var(--text-sm); cursor: pointer; transition: background var(--dur-micro), border-color var(--dur-micro), color var(--dur-micro), transform var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-paper-3); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn[data-done="true"] { border-color: var(--color-success); color: var(--color-success); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn.primary:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); }
.btn.small { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-xs); }
.field { width: 100%; min-height: 40px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); }
.field:hover { border-color: var(--color-muted); }
.field[aria-invalid="true"] { border-color: var(--color-error); }
.field-error { min-height: 1lh; font-size: var(--text-sm); color: var(--color-error); }

/* ---- main ---- */
.main { padding: var(--space-lg) var(--space-xl) calc(var(--space-2xl) * 2); max-width: 82rem; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); }
.col-main, .col-side { min-width: 0; }
.col-side:has(.plan[hidden]) { display: none; }
.runs { display: inline-flex; align-items: center; gap: var(--space-xs); padding-inline: var(--space-sm); min-height: 32px; border-radius: var(--radius-ctl); background: var(--color-accent-soft); color: var(--color-accent); font-size: var(--text-sm); font-weight: 500; }
.runs .num { font-family: var(--font-data); }
@media (min-width: 75rem) {
  .cols { grid-template-columns: minmax(0, 1fr) 19rem; column-gap: var(--space-xl); align-items: start; }
  .col-side .plan { position: sticky; top: calc(var(--bar-h) + var(--space-xs)); margin-top: 0; }
  .head, .summary { max-width: none; }
}
.main:focus { outline: none; }
.head { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-md); }
.status { display: inline-flex; align-items: center; gap: var(--space-xs); align-self: flex-start; font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.status.running { color: var(--color-accent); }
.status.done { color: var(--color-success); }
.status.failed { color: var(--color-error); }
.head h1 { font-size: var(--text-xl); line-height: 1.3; font-weight: 700; }
.summary { color: var(--color-ink-2); font-size: var(--text-md); max-width: 46rem; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-md); margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: var(--rule-hair) solid var(--color-rule); }
.stats dt { font-size: var(--text-xs); color: var(--color-muted); }
.stats dd { font-family: var(--font-data); font-size: var(--text-sm); }

.now { position: sticky; top: calc(var(--bar-h) + var(--space-xs)); z-index: var(--z-raised); display: flex; flex-direction: column; gap: var(--space-2xs); padding: var(--space-md) var(--space-lg); background: var(--color-glass); -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); box-shadow: var(--shadow-sheet); }
.now[data-status="running"] { border-color: var(--color-accent); }
.now:not([data-status="running"]) { position: static; box-shadow: none; background: var(--color-paper-2); }
.now[data-status="done"] { border-color: var(--color-success); }
.now[data-status="failed"] { border-color: var(--color-error); }
.now-label { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
.now-label .ic { width: 14px; height: 14px; color: var(--color-accent); animation: pulse 1.6s ease-in-out infinite; }
.now-text { font-size: var(--text-xl); font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
@media (max-width: 40rem) { .now-text { font-size: var(--text-lg); } }
.now-next { font-size: var(--text-sm); color: var(--color-ink-2); display: flex; gap: var(--space-xs); }
.now-next b { font-weight: 700; color: var(--color-muted); }
.now-result { font-size: var(--text-sm); color: var(--color-ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.progress { display: flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-xs); }
.progress-track { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--color-paper-3); overflow: hidden; }
.progress-fill { height: 100%; width: 100%; border-radius: var(--radius-pill); background: var(--color-accent); transform-origin: left center; }
.progress .num { font-family: var(--font-data); font-size: var(--text-xs); color: var(--color-muted); min-width: 3ch; text-align: right; }
.idle { display: flex; gap: var(--space-xs); align-items: flex-start; margin-top: var(--space-xs); padding: var(--space-xs) var(--space-sm); border: var(--rule-hair) solid var(--color-warn-rule); border-radius: var(--radius-ctl); background: var(--color-warn-soft); color: var(--color-warn); font-size: var(--text-sm); }
.idle .ic { margin-top: var(--space-2xs); }
.idle b { font-family: var(--font-data); font-weight: 500; }

.plan { margin-top: var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); }
.plan > summary { display: flex; align-items: center; gap: var(--space-xs); min-height: 44px; padding: 0 var(--space-md); cursor: pointer; list-style: none; font-size: var(--text-sm); font-weight: 500; border-radius: var(--radius-card); }
.plan > summary::-webkit-details-marker { display: none; }
.plan > summary:hover { background: var(--color-paper-2); }
.plan > summary .num { color: var(--color-muted); font-family: var(--font-data); font-size: var(--text-xs); }
.plan > summary .chev { margin-left: auto; transition: transform var(--dur-short) var(--ease-out); }
.plan[open] > summary .chev { transform: rotate(180deg); }
.planlist { list-style: none; display: flex; flex-direction: column; gap: var(--space-3xs); padding: 0 var(--space-md) var(--space-sm); }
.planitem { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); }
.planitem .ic { margin-top: var(--space-2xs); }
.planitem[data-status="running"] { color: var(--color-ink); font-weight: 500; }
.planitem[data-status="running"] .ic { color: var(--color-accent); }
.planitem[data-status="done"] .ic { color: var(--color-success); }
.planitem[data-status="done"] span { color: var(--color-ink-2); }
.planitem[data-status="failed"] { color: var(--color-error); }

.log { margin-top: var(--space-lg); }
.log-head { display: flex; align-items: center; gap: var(--space-md); margin-bottom: var(--space-md); }
.log-head h2 { font-size: var(--text-lg); font-weight: 700; }
.log-head .num { margin-right: auto; font-size: var(--text-sm); color: var(--color-muted); }

/* ---- the ledger ---- */
.steps { list-style: none; display: flex; flex-direction: column; }
.steps[data-order="new"] { flex-direction: column-reverse; }
.step { --time-w: 4.4rem; --step-gap: var(--space-sm); position: relative; display: grid; grid-template-columns: var(--time-w) 28px minmax(0, 1fr); column-gap: var(--step-gap); padding-bottom: var(--space-md); }
.step::before { content: ""; position: absolute; left: calc(var(--time-w) + var(--step-gap) + 13px); top: 0; bottom: 0; width: 2px; background: var(--color-rule); }
.step:first-child::before { top: 14px; }
.step:last-child::before { bottom: auto; height: 14px; }
.step:last-child { padding-bottom: 0; }
.steps[data-order="new"] .step:first-child::before { top: 0; bottom: auto; height: 14px; }
.steps[data-order="new"] .step:last-child::before { top: 14px; bottom: 0; height: auto; }
.steps[data-order="new"] .step:first-child { padding-bottom: 0; }
.steps[data-order="new"] .step:last-child { padding-bottom: var(--space-md); }
.step:only-child::before { display: none !important; }
.s-time { display: flex; flex-direction: column; align-items: flex-end; padding-top: var(--space-2xs); font-family: var(--font-data); font-size: var(--text-xs); color: var(--color-muted); line-height: 1.4; }
.s-gap { opacity: 0.8; }
.s-node { position: relative; z-index: var(--z-base); width: 28px; height: 28px; display: grid; place-items: center; border: 1.5px solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-paper); color: var(--color-ink-2); }
.step[data-status="running"] .s-node { border-color: var(--color-accent); color: var(--color-accent); }
.step[data-status="running"] .s-node::after { content: ""; position: absolute; inset: -5px; border: 2px solid transparent; border-top-color: var(--color-accent); border-radius: var(--radius-pill); animation: spin 1.1s linear infinite; }
.step[data-status="failed"] .s-node { border-color: var(--color-error); color: var(--color-error); background: var(--color-error-soft); }
.step[data-status="skipped"] .s-node { border-style: dashed; color: var(--color-muted); }
.s-body { min-width: 0; margin: calc(var(--space-xs) * -1 + var(--space-3xs)) 0 0 calc(var(--space-xs) * -1); padding: var(--space-xs) var(--space-sm) var(--space-xs) var(--space-xs); border-radius: var(--radius-ctl); }
.step[data-status="running"] .s-body { background: var(--color-accent-soft); }
.step[data-status="failed"] .s-body { background: var(--color-error-soft); }
.s-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); line-height: 1.6; }
.s-state { font-family: var(--font-data); }
.s-state.run { color: var(--color-accent); }
.s-state.err { color: var(--color-error); }
.s-title { font-size: var(--text-md); font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
.step[data-status="failed"] .s-title { color: var(--color-error); }
.step[data-status="skipped"] .s-title { color: var(--color-muted); }
.s-detail { margin-top: var(--space-2xs); font-size: var(--text-sm); color: var(--color-ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.step[data-kind="run"] .s-detail { font-family: var(--font-data); font-size: var(--text-xs); line-height: 1.7; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-paper-2); }
.s-detail.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.more { margin-top: var(--space-2xs); min-height: 32px; padding: 0 var(--space-xs); margin-left: calc(var(--space-xs) * -1); border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--color-accent); font-size: var(--text-xs); cursor: pointer; }
.more:hover { background: var(--color-accent-soft); }
.more:active { transform: scale(0.97); }

/* ---- states ---- */
.state { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-sm); max-width: 36rem; padding-top: var(--space-xl); }
.state > .ic { width: 28px; height: 28px; color: var(--color-muted); }
.state h1 { font-size: var(--text-xl); line-height: 1.3; }
.state p { color: var(--color-ink-2); }
.endpoint { display: flex; align-items: center; gap: var(--space-xs); width: 100%; padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-sm); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper-2); }
.endpoint code { flex: 1; min-width: 0; font-family: var(--font-data); font-size: var(--text-sm); overflow-wrap: anywhere; }
.state form { display: flex; flex-direction: column; gap: var(--space-xs); width: 100%; }
.state label { font-size: var(--text-sm); font-weight: 500; }
.howto { list-style: none; counter-reset: n; display: flex; flex-direction: column; gap: var(--space-xs); margin-top: var(--space-sm); padding-top: var(--space-md); border-top: var(--rule-hair) solid var(--color-rule); width: 100%; font-size: var(--text-sm); color: var(--color-ink-2); }
.howto li { counter-increment: n; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); }
.howto li::before { content: counter(n); font-family: var(--font-data); color: var(--color-muted); }
.howto code { font-family: var(--font-data); font-size: var(--text-xs); }
.sk { border-radius: var(--radius-ctl); background: var(--color-paper-3); animation: pulse 1.4s ease-in-out infinite; }

/* ---- purge wizard ---- */
.btn.danger { border-color: var(--color-error); color: var(--color-error); }
.btn.danger:hover { background: var(--color-error-soft); }
.btn.danger:disabled { border-color: var(--color-rule); color: var(--color-muted); background: transparent; }
.wiz { width: min(34rem, calc(100% - 2rem)); max-height: calc(100dvh - 2rem); padding: 0; border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); color: var(--color-ink); box-shadow: var(--shadow-sheet); overflow: auto; }
.wiz::backdrop { background: var(--color-scrim); }
.wiz-in { display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-lg); }
.wiz-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
.wiz-head h2 { display: flex; align-items: center; gap: var(--space-xs); font-size: var(--text-lg); color: var(--color-error); }
.wiz-steps { list-style: none; display: flex; gap: var(--space-2xs); }
.wiz-steps li { flex: 1; height: 4px; border-radius: var(--radius-ctl); background: var(--color-paper-3); }
.wiz-steps li[data-state="done"] { background: var(--color-ink-2); }
.wiz-steps li[data-state="current"] { background: var(--color-error); }
.wiz-body { display: flex; flex-direction: column; gap: var(--space-sm); }
.wiz-body p { color: var(--color-ink-2); }
.wiz-body .field-error { color: var(--color-error); }
.wiz-warn { display: flex; gap: var(--space-xs); align-items: flex-start; padding: var(--space-sm); border: var(--rule-hair) solid var(--color-error); border-radius: var(--radius-ctl); background: var(--color-error-soft); color: var(--color-error); font-weight: 500; }
.wiz-warn .ic { margin-top: var(--space-2xs); }
.wiz-count { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-md); }
.wiz-count dt { font-size: var(--text-xs); color: var(--color-muted); }
.wiz-count dd { font-family: var(--font-data); font-size: var(--text-xl); }
.wiz-q { font-family: var(--font-data); font-size: var(--text-2xl); color: var(--color-ink) !important; }
.wiz-actions { display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm); margin-top: var(--space-xs); }
.wiz-actions .wiz-actions { margin-top: 0; }
.trace { position: relative; width: 100%; aspect-ratio: 14 / 5; border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); touch-action: none; cursor: crosshair; overflow: hidden; }
.trace canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.trace-meter { display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }
.trace-meter .num { font-family: var(--font-data); }
.trace-meter[data-pass="true"] { color: var(--color-success); }
.trace-meter[data-pass="true"] span:first-child::before { content: ""; }

/* ---- narrow ---- */
@media (max-width: 60rem) {
  .menu-btn { display: inline-grid; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; top: var(--bar-h); bottom: 0; left: 0; height: auto; width: min(20rem, 88vw); z-index: var(--z-drawer); transform: translateX(-105%); box-shadow: var(--shadow-sheet); transition: transform var(--dur-short) var(--ease-out); }
  .rail[data-open] { transform: none; }
  .main { padding: var(--space-md) var(--space-md) calc(var(--space-2xl) * 2 + env(safe-area-inset-bottom, 0px)); }
  .cols { display: flex; flex-direction: column; }
  .col-main, .col-side { display: contents; }
  .now { order: 1; }
  .col-side .plan { order: 2; }
  .log { order: 3; }
}
@media (max-width: 40rem) {
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-xs); }
  .stats dd { font-size: var(--text-xs); }
  .summary { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--text-sm); }
  .step { --time-w: 3.6rem; --step-gap: var(--space-xs); }
  .now { padding: var(--space-sm) var(--space-md); }
  .head h1 { font-size: var(--text-lg); }
  .runs > span { font-size: 0; }
  .runs .num { font-size: var(--text-sm); }
  .conn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}
</style>

        <div class="col-main">
          <section class="now" id="now" aria-live="polite" aria-atomic="true"></section>
          <section class="log" aria-labelledby="logTitle">
            <div class="log-head"><h2 id="logTitle">作業の流れ</h2><span class="num" id="logCount"></span><button class="btn small" type="button" id="copyLog"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg><span>ログをコピー</span></button></div>
            <ol class="steps" id="steps" data-order="new"></ol>
          </section>
        </div>
        <aside class="col-side" aria-label="予定">
          <details class="plan" id="plan" open></details>
        </aside>
      </div>
    </article>
  </main>
</div>
<dialog class="wiz" id="purge" aria-labelledby="wizTitle">
  <div class="wiz-in">
    <header class="wiz-head"><h2 id="wizTitle"><svg class="ic" aria-hidden="true"><use href="#i-trash-2"/></svg><span>すべてのログを消去</span></h2><button class="icon-btn" id="wizClose" type="button" aria-label="閉じる"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></header>
    <ol class="wiz-steps" id="wizSteps"></ol>
    <div class="wiz-body" id="wizBody"></div>
  </div>
</dialog>
<div class="scrim" id="scrim" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const linkify = (t) => esc(t).replace(/https?:\/\/[^\s<>"]+/g, (u) => {
  const m = u.match(/[.,;:)\]、。]+$/);
  const tail = m ? m[0] : '';
  const url = tail ? u.slice(0, -tail.length) : u;
  return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`;
});
const p2 = (n) => String(n).padStart(2, '0');
const hms = (ms) => { const d = new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
const clock = (ms) => {
  const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${p2(m)}:${p2(x)}` : `${m}:${p2(x)}`;
};
const human = (ms) => ms < 1000 ? '1秒未満' : ms < 10000 ? `${(ms / 1000).toFixed(1)}秒` : ms < 60000 ? `${Math.round(ms / 1000)}秒` : clock(ms);
const store = {
  get(k, d) { try { const v = localStorage.getItem('workline.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('workline.' + k, v); } catch {} },
  del(k) { try { localStorage.removeItem('workline.' + k); } catch {} },
};

const KIND = {
  plan: ['計画', 'list-checks'], think: ['考え中', 'brain'], search: ['検索', 'search'], read: ['読み込み', 'book-open'],
  write: ['編集', 'pencil-line'], run: ['実行', 'terminal'], web: ['通信', 'globe'], check: ['確認', 'circle-check'],
  fix: ['修正', 'wrench'], wait: ['待機', 'hourglass'], note: ['メモ', 'message-square-text'],
};
const TASK_ST = {
  running: ['実行中', 'loader-circle'], done: ['完了', 'circle-check'], failed: ['失敗', 'circle-x'], cancelled: ['中断', 'ban'],
};
const PLAN_ST = { planned: 'circle-dashed', running: 'loader-circle', done: 'circle-check', failed: 'circle-x', skipped: 'circle-minus' };
const FINISH_TEXT = { done: '作業が完了しました', failed: '作業が失敗しました', cancelled: '作業を中断しました' };

/* ================= state ================= */
const S = {
  tasks: new Map(), sel: null, maxId: 0, follow: true, agents: new Map(), filter: '', fsig: '',
  newestFirst: store.get('order', 'new') === 'new', sound: store.get('sound', '0') === '1',
  conn: 'connecting', offset: 0, auth: null, token: store.get('token', ''), planOpen: true,
  sig: '', expanded: new Set(), lastNow: '', lastProgress: 0, rows: new Map(), stepEls: new Map(), booted: false,
};
const nowMs = () => Date.now() + S.offset;

/* ---- which AI: avatar (site icon fetched by the server, initial letter as fallback) ---- */
const tintOf = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 6; };
const agentOf = (id) => S.agents.get(id) || { id, name: id || '不明なAI', model: '', domain: '', hasIcon: false };
function avatar(id, size = 20) {
  const a = agentOf(id);
  const src = `/api/icon?agent=${encodeURIComponent(a.id)}${S.token ? '&token=' + encodeURIComponent(S.token) : ''}`;
  return `<span class="av" data-t="${tintOf(a.id)}" style="--av:${size}px" aria-hidden="true"><span>${esc([...a.name][0] || '?')}</span>${a.hasIcon ? `<img src="${src}" alt="" loading="lazy" decoding="async">` : ''}</span>`;
}
// no icon could be fetched: drop the broken image and let the initial letter show
document.addEventListener('error', (e) => { const t = e.target; if (t && t.tagName === 'IMG' && t.closest('.av')) t.remove(); }, true);
const matches = (t) => !S.filter || t.agent === S.filter;
const latest = () => { let m = 0; for (const t of S.tasks.values()) if (matches(t) && t.id > m) m = t.id; return m; };

// token passed via URL once, then removed from the address bar
try {
  const u = new URL(location.href);
  const t = u.searchParams.get('token');
  if (t) { S.token = t; store.set('token', t); u.searchParams.delete('token'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
} catch {}

const el = {
  conn: $('#conn'), list: $('#taskList'), rail: $('#rail'), scrim: $('#scrim'), menu: $('#menuBtn'),
  filter: $('#agentFilter'), state: $('#state'), task: $('#task'), head: $('#head'), now: $('#now'), plan: $('#plan'),
  steps: $('#steps'), count: $('#logCount'), follow: $('#followBtn'), order: $('#orderBtn'),
  sound: $('#soundBtn'), note: $('#railNote'), main: $('#main'),
};

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const motion = () => !reduced && !!window.gsap;

/* ================= sound (small synthesized ticks, off by default) ================= */
let actx = null, lastTick = 0;
function beep(freq, dur, type = 'sine', gain = 0.035, delay = 0, to = 0) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch {}
}
const sfx = {
  step() { const n = performance.now(); if (n - lastTick < 140) return; lastTick = n; beep(520, 0.09, 'sine', 0.035, 0, 360); },
  done() { beep(659, 0.18, 'sine', 0.04); beep(988, 0.3, 'sine', 0.035, 0.09); },
  fail() { beep(190, 0.32, 'triangle', 0.05, 0, 130); },
};

/* ================= connection ================= */
const CONN = { live: ['wifi', 'ライブ'], connecting: ['loader-circle', '接続中'], retry: ['wifi-off', '再接続中'], denied: ['lock', 'トークンが必要'] };
function setConn(s) {
  S.conn = s; el.conn.dataset.state = s;
  el.conn.innerHTML = `${icon(CONN[s][0], s === 'connecting' ? 'spin' : '')}<span>${CONN[s][1]}</span>`;
}

let ws = null, backoff = 1000, pingTimer = 0, lastPong = 0, pollTimer = 0, retryTimer = 0;
const authHeaders = () => (S.token ? { authorization: 'Bearer ' + S.token } : {});

async function fetchSnapshot() {
  const r = await fetch('/api/snapshot', { cache: 'no-store', headers: authHeaders() });
  if (r.status === 401) { const e = new Error('denied'); e.denied = true; throw e; }
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}

async function boot() {
  setConn('connecting');
  if (!S.booted) showState('loading');
  try {
    handle(await fetchSnapshot(), true);
    S.booted = true;
    connect();
  } catch (e) {
    if (e.denied) { setConn('denied'); showState('locked'); return; }
    setConn('retry');
    if (!S.booted) showState('error');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(boot, Math.min(backoff *= 2, 15000));
  }
}

function connect() {
  clearTimeout(retryTimer);
  try { ws && ws.close(); } catch {}
  const q = S.token ? `?token=${encodeURIComponent(S.token)}` : '';
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws${q}`);
  const mine = ws;
  ws.onopen = () => {
    backoff = 1000; lastPong = Date.now(); setConn('live');
    clearInterval(pollTimer); pollTimer = 0;
    clearInterval(pingTimer);
    pingTimer = setInterval(() => {
      if (Date.now() - lastPong > 60000) { try { mine.close(); } catch {} return; }
      try { mine.send('ping'); } catch {}
    }, 25000);
  };
  ws.onmessage = (e) => {
    if (e.data === 'pong') { lastPong = Date.now(); return; }
    try { const j = JSON.parse(e.data); handle(j, j.t === 'snapshot'); } catch (err) { console.error(err); }
  };
  ws.onclose = () => {
    if (mine !== ws) return;
    clearInterval(pingTimer);
    if (S.conn !== 'denied') setConn('retry');
    if (!pollTimer) pollTimer = setInterval(async () => { try { handle(await fetchSnapshot(), true); } catch {} }, 5000);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, backoff = Math.min(backoff * 2, 15000));
  };
  ws.onerror = () => {};
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.booted && (!ws || ws.readyState > 1)) { backoff = 1000; connect(); }
});

/* ================= data ================= */
function upsertTask(t) {
  let cur = S.tasks.get(t.id);
  if (!cur) { cur = { steps: new Map(), order: [] }; S.tasks.set(t.id, cur); }
  const { steps, ...rest } = t;
  Object.assign(cur, rest);
  return cur;
}
function upsertStep(s) {
  const t = S.tasks.get(s.taskId);
  if (!t) return null;
  const isNew = !t.steps.has(s.id);
  t.steps.set(s.id, s);
  if (isNew) t.order.push(s.id);
  return { t, isNew };
}

function handle(msg, quiet = false) {
  if (msg.t === 'purged') { clearAll(); return; }
  if (msg.t === 'snapshot') {
    S.offset = msg.serverTime - Date.now();
    S.auth = msg.auth;
    el.note.hidden = !(msg.auth && msg.auth.writeOpen);
    const prevLatest = latest();
    for (const a of msg.agents || []) S.agents.set(a.id, a);
    for (const raw of [...msg.tasks].reverse()) {
      const t = upsertTask(raw);
      const known = new Set(t.order);
      for (const s of raw.steps || []) { if (!known.has(s.id)) upsertStep(s); else t.steps.set(s.id, s); }
      S.maxId = Math.max(S.maxId, raw.id);
      ensureRow(t);
      renderRow(t);
    }
    if (S.sel === null || !S.tasks.has(S.sel)) {
      const hash = Number((location.hash.match(/t=(\d+)/) || [])[1]);
      select(S.tasks.has(hash) ? hash : latest() || S.maxId || null, { keepFollow: true });
    } else if (S.follow && latest() > prevLatest) {
      select(latest(), { keepFollow: true });
    } else {
      const cur = S.tasks.get(S.sel);
      if (sig(cur) !== S.sig) buildSteps(cur);
      refreshSelected(quiet);
    }
    if (!S.tasks.size) showState('empty');
    renderFilter();
    return;
  }
  if (msg.t !== 'patch') return;

  const wasLatest = latest();
  const prevStatus = S.tasks.get(msg.task.id)?.status;
  if (msg.agent) {
    const prev = S.agents.get(msg.agent.id);
    S.agents.set(msg.agent.id, msg.agent);
    if (!prev || prev.domain !== msg.agent.domain || prev.name !== msg.agent.name) { for (const x of S.tasks.values()) renderRow(x); }
  }
  const t = upsertTask(msg.task);
  S.maxId = Math.max(S.maxId, t.id);
  ensureRow(t);
  const fresh = [];
  for (const s of msg.steps || []) {
    const r = upsertStep(s);
    if (r && r.isNew) fresh.push(s.id);
  }
  renderRow(t);
  if (S.sound) {
    if (prevStatus === 'running' && t.status === 'done') sfx.done();
    else if (prevStatus === 'running' && (t.status === 'failed' || t.status === 'cancelled')) sfx.fail();
    else if (fresh.length) sfx.step();
  }
  renderFilter();
  if ((matches(t) && t.id > wasLatest && S.follow) || S.sel === null) { select(t.id, { keepFollow: true }); return; }
  if (t.id === S.sel) refreshSelected(false, fresh, msg.steps || []);
}

/* ================= task list ================= */
function ensureRow(t) {
  if (S.rows.has(t.id)) return;
  const li = document.createElement('li');
  li.innerHTML = `<button class="trow" type="button" data-id="${t.id}"></button>`;
  // newest first: sit directly above the nearest row with a smaller id
  let anchor = null;
  for (const [id, row] of S.rows) if (id < t.id && (!anchor || id > anchor.id)) anchor = { id, row };
  el.list.insertBefore(li, anchor ? anchor.row : null);
  li.hidden = !matches(t);
  S.rows.set(t.id, li);
  if (el.list.querySelector('.sk-row')) el.list.querySelectorAll('.sk-row').forEach((n) => n.remove());
}
function renderRow(t) {
  const li = S.rows.get(t.id); if (!li) return;
  const b = li.firstElementChild, st = TASK_ST[t.status] || TASK_ST.running;
  b.dataset.status = t.status;
  b.setAttribute('aria-current', String(t.id === S.sel));
  const when = t.status === 'running'
    ? `<span class="trow-when num live" data-kind="elapsed" data-t0="${t.startedAt}">${clock(nowMs() - t.startedAt)}</span>`
    : `<span class="trow-when num">${st[0]} ${clock((t.finishedAt || t.updatedAt) - t.startedAt)}</span>`;
  b.innerHTML = `<span class="trow-ic">${icon(st[1], t.status === 'running' ? 'spin' : '')}</span><span class="trow-main"><span class="trow-title">${esc(t.title)}</span><span class="trow-meta"><span class="trow-by">${avatar(t.agent, 16)}<span>${esc(agentOf(t.agent).name)}</span></span>${when}</span></span>`;
  updateRuns();
}
el.list.addEventListener('click', (e) => {
  const b = e.target.closest('.trow'); if (!b) return;
  const id = Number(b.dataset.id);
  if (id !== latest()) setFollow(false);
  select(id, { keepFollow: true });
  closeDrawer();
});

/* ================= selected task view ================= */
function select(id, opts = {}) {
  if (id === null || !S.tasks.has(id)) { showState('empty'); return; }
  const changed = S.sel !== id;
  S.sel = id;
  if (!opts.keepFollow) setFollow(false);
  history.replaceState(null, '', `#t=${id}`);
  for (const [tid, li] of S.rows) li.firstElementChild.setAttribute('aria-current', String(tid === id));
  el.state.innerHTML = ''; el.task.hidden = false;
  buildSteps(S.tasks.get(id));
  refreshSelected(true);
  if (changed && motion()) gsap.fromTo(el.task, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.28, ease: 'power3.out', clearProps: 'transform,opacity' });
}

function refreshSelected(quiet, freshIds = [], touched = []) {
  const t = S.tasks.get(S.sel); if (!t) return;
  S.sig = sig(t);
  renderHead(t); renderNow(t, quiet); renderPlan(t);
  el.count.textContent = `${t.steps.size}件`;
  const nearBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 160;
  for (const s of touched) {
    let li = S.stepEls.get(s.id);
    if (!li) { li = document.createElement('li'); li.className = 'step'; S.stepEls.set(s.id, li); el.steps.appendChild(li); }
    fillStep(li, t, s);
    if (freshIds.includes(s.id) && !quiet && motion()) {
      gsap.fromTo(li, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.36, ease: 'power3.out', clearProps: 'transform,opacity' });
      const band = li.querySelector('.s-body');
      gsap.fromTo(band, { backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--color-accent-soft').trim() }, { backgroundColor: 'transparent', duration: 1.4, ease: 'power2.out', clearProps: 'backgroundColor' });
    }
  }
  // the previous newest step needs its gap/connector refreshed only when a neighbour changes; cheap to skip.
  if (freshIds.length && !S.newestFirst && nearBottom) scrollTo({ top: document.documentElement.scrollHeight, behavior: reduced ? 'auto' : 'smooth' });
  document.title = t.status === 'running' ? `実行中: ${t.now || t.title} - Workline` : `${(TASK_ST[t.status] || ['', ''])[0]}: ${t.title} - Workline`;
}

const sig = (t) => `${t.order.length}/${[...t.steps.values()].reduce((a, s) => Math.max(a, s.updatedAt), 0)}`;
function buildSteps(t) {
  S.sig = sig(t);
  el.steps.dataset.order = S.newestFirst ? 'new' : 'old';
  el.steps.innerHTML = ''; S.stepEls.clear(); S.lastNow = ''; S.lastProgress = 0;
  const frag = document.createDocumentFragment();
  for (const id of t.order) {
    const s = t.steps.get(id), li = document.createElement('li');
    li.className = 'step'; S.stepEls.set(id, li); fillStep(li, t, s); frag.appendChild(li);
  }
  el.steps.appendChild(frag);
}

function fillStep(li, t, s) {
  const k = KIND[s.kind] || KIND.note;
  const idx = t.order.indexOf(s.id), prev = idx > 0 ? t.steps.get(t.order[idx - 1]) : null;
  li.dataset.status = s.status; li.dataset.kind = s.kind; li.dataset.id = s.id;
  const dur = s.endedAt ? s.endedAt - s.createdAt : 0;
  let state = '';
  if (s.status === 'running') state = `<span class="s-state run">実行中 <span class="num live" data-kind="since" data-t0="${s.createdAt}">${clock(nowMs() - s.createdAt)}</span></span>`;
  else if (s.status === 'failed') state = `<span class="s-state err">失敗${dur >= 1000 ? ' ' + human(dur) : ''}</span>`;
  else if (s.status === 'skipped') state = `<span class="s-state">スキップ</span>`;
  else if (dur >= 1000) state = `<span class="s-state num">所要 ${human(dur)}</span>`;
  const long = s.detail && (s.detail.length > 160 || s.detail.split('\n').length > 3);
  const open = S.expanded.has(s.id);
  const detail = s.detail
    ? `<div class="s-detail${long && !open ? ' clamp' : ''}" id="d${s.id}">${linkify(s.detail)}</div>${long ? `<button class="more" type="button" data-more="${s.id}" aria-expanded="${open}" aria-controls="d${s.id}">${open ? '閉じる' : 'すべて表示'}</button>` : ''}`
    : '';
  li.innerHTML = `
    <div class="s-time"><span class="num">${hms(s.createdAt)}</span>${prev && s.createdAt - prev.createdAt >= 1000 ? `<span class="num s-gap" title="前のステップから">+${clock(s.createdAt - prev.createdAt)}</span>` : ''}</div>
    <div><span class="s-node">${icon(k[1])}</span></div>
    <div class="s-body"><div class="s-meta"><span>${k[0]}</span>${s.agent && s.agent !== t.agent ? `<span class="s-by">${avatar(s.agent, 16)}<span>${esc(agentOf(s.agent).name)}</span></span>` : ''}${state}</div><div class="s-title">${esc(s.title)}</div>${detail}</div>`;
}
el.steps.addEventListener('click', (e) => {
  const b = e.target.closest('[data-more]'); if (!b) return;
  const id = Number(b.dataset.more), t = S.tasks.get(S.sel);
  S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id);
  fillStep(S.stepEls.get(id), t, t.steps.get(id));
});

function renderHead(t) {
  const st = TASK_ST[t.status] || TASK_ST.running, run = t.status === 'running';
  const end = t.finishedAt || '';
  el.head.innerHTML = `
    <div class="head-top"><div class="status ${t.status}">${icon(st[1], run ? 'spin' : '')}<span>${st[0]}</span></div>
      <div class="by">${avatar(t.agent, 24)}<span class="by-name">${esc(agentOf(t.agent).name)}</span>${t.model ? `<span class="by-model">${esc(t.model)}</span>` : ''}</div></div>
    <h1>${esc(t.title)}</h1>
    ${t.summary ? `<p class="summary">${linkify(t.summary)}</p>` : ''}
    <dl class="stats">
      <div><dt>開始</dt><dd class="num">${hms(t.startedAt)}</dd></div>
      <div><dt>${run ? '経過' : '所要時間'}</dt><dd class="num live" data-kind="elapsed" data-t0="${t.startedAt}" data-t1="${end}">${clock((end || nowMs()) - t.startedAt)}</dd></div>
      <div><dt>ステップ</dt><dd class="num">${t.steps.size}件</dd></div>
      <div><dt>最終更新</dt><dd class="num">${run ? `<span class="live" data-kind="ago" data-t0="${t.updatedAt}">${clock(nowMs() - t.updatedAt)}前</span>` : hms(t.updatedAt)}</dd></div>
    </dl>`;
}

function renderNow(t, quiet) {
  const run = t.status === 'running';
  el.now.dataset.status = t.status;
  const text = run ? (t.now || '作業を始めています') : (FINISH_TEXT[t.status] || '');
  const pct = t.progress == null ? null : Math.round(t.progress);
  el.now.innerHTML = `
    <div class="now-label">${run ? icon('radio') : ''}<span>${run ? 'いまやっていること' : '結果'}</span></div>
    <p class="now-text" id="nowText">${esc(text)}</p>
    ${run && t.next ? `<p class="now-next"><b>次</b><span>${esc(t.next)}</span></p>` : ''}
    ${!run && t.result ? `<p class="now-result">${linkify(t.result)}</p>` : ''}
    ${pct !== null ? `<div class="progress"><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="全体の進捗"><div class="progress-fill" id="pfill" style="transform:scaleX(${motion() && !quiet ? S.lastProgress / 100 : pct / 100})"></div></div><span class="num">${pct}%</span></div>` : ''}

  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {} ta.remove();

function logMarkdown(t) {
  if (!t) return '';
  const mark = { running: '…', done: 'OK', failed: 'NG', skipped: '-' };
  const lines = [`# ${t.title}`, '', `AI: ${agentOf(t.agent).name}${t.model ? ` (${t.model})` : ''} / 状態: ${(TASK_ST[t.status] || TASK_ST.running)[0]} / 開始 ${hms(t.startedAt)} / ステップ ${t.steps.size}件`];
  if (t.summary) lines.push('', t.summary);
  lines.push('');
  for (const id of t.order) {
    const s = t.steps.get(id);
    lines.push(`- ${hms(s.createdAt)} [${mark[s.status] || '-'}] ${(KIND[s.kind] || KIND.note)[0]}${s.agent && s.agent !== t.agent ? ` (${agentOf(s.agent).name})` : ''}: ${s.title}`);
    if (s.detail) lines.push(...s.detail.split('\n').map((l) => `    ${l}`));
  }
  if (t.result) lines.push('', `結果: ${t.result}`);
  return lines.join('\n');
}

function renderFilter() {
  const owners = new Set([...S.tasks.values()].map((t) => t.agent));   // sub-agents that only appear inside a task get no chip
  const list = [...S.agents.values()].filter((a) => owners.has(a.id)).sort((a, b) => b.lastSeen - a.lastSeen);
  const run = {};
  for (const t of S.tasks.values()) if (t.status === 'running') run[t.agent] = (run[t.agent] || 0) + 1;
  const sig = JSON.stringify([list.map((a) => [a.id, a.hasIcon]), run, S.filter]);
  if (sig === S.fsig) return;

  el.filter.innerHTML = `<button class="chip" type="button" data-agent="" aria-pressed="${!S.filter}"><span>すべて</span></button>` +
    list.map((a) => `<button class="chip" type="button" data-agent="${esc(a.id)}" aria-pressed="${S.filter === a.id}">${avatar(a.id, 16)}<span>${esc(a.name)}</span>${run[a.id] ? `<span class="num" title="実行中">${run[a.id]}</span>` : ''}</button>`).join('');
}
function applyFilter() {

/* ================= drawer (under 60rem): springy, interruptible, draggable ================= */
const narrow = matchMedia('(max-width: 60rem)');
let drawerOpen = false, dragging = null;
const railW = () => el.rail.offsetWidth + 24;
function syncDrawer() {
  if (!narrow.matches) {
    drawerOpen = false; el.rail.inert = false; el.scrim.hidden = true; el.menu.setAttribute('aria-expanded', 'false');
    if (window.gsap) gsap.set([el.rail, el.scrim], { clearProps: 'all' });
    return;
  }
  el.rail.inert = !drawerOpen;
  if (motion()) el.rail.style.transition = 'none';   // gsap drives the transform, CSS must not chase it
  if (motion() && !drawerOpen) gsap.set(el.rail, { x: -railW() });
}
function openDrawer() {
  if (!narrow.matches) return;
  drawerOpen = true; el.rail.inert = false; el.scrim.hidden = false; el.menu.setAttribute('aria-expanded', 'true');
  if (motion()) {
    el.rail.style.transition = 'none';
    gsap.to(el.rail, { x: 0, duration: 0.38, ease: 'power3.out', overwrite: 'auto' });
    gsap.to(el.scrim, { opacity: 1, duration: 0.25, overwrite: 'auto' });
  } else { el.rail.dataset.open = ''; el.scrim.style.opacity = 1; }
  el.rail.querySelector('.trow[aria-current="true"], .trow, .chip')?.focus({ preventScroll: true });
}
function closeDrawer() {
  if (!narrow.matches || !drawerOpen) return;
  drawerOpen = false; el.rail.inert = true; el.menu.setAttribute('aria-expanded', 'false');
  const done = () => { if (!drawerOpen) el.scrim.hidden = true; };
  if (el.rail.contains(document.activeElement)) el.menu.focus({ preventScroll: true });
  if (motion()) {
    el.rail.style.transition = 'none';
    gsap.to(el.rail, { x: -railW(), duration: 0.32, ease: 'power3.out', overwrite: 'auto' });
    gsap.to(el.scrim, { opacity: 0, duration: 0.22, overwrite: 'auto', onComplete: done });
  } else { delete el.rail.dataset.open; el.scrim.style.opacity = 0; done(); }
}
el.menu.addEventListener('click', () => (drawerOpen ? closeDrawer() : openDrawer()));
el.scrim.addEventListener('click', closeDrawer);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
narrow.addEventListener('change', syncDrawer);

el.rail.addEventListener('pointerdown', (e) => {
  if (!narrow.matches || !drawerOpen || !window.gsap || reduced) return;
  dragging = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: gsap.getProperty(el.rail, 'x'), samples: [[performance.now(), e.clientX]], active: false };
});
el.rail.addEventListener('pointermove', (e) => {
  const d = dragging; if (!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.active) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;           // hysteresis before committing to a direction
    if (Math.abs(dy) > Math.abs(dx)) { dragging = null; return; }  // vertical: let the list scroll
    d.active = true; el.rail.setPointerCapture(e.pointerId); gsap.killTweensOf([el.rail, el.scrim]);
  }
  const x = Math.min(0, d.x + dx);                                  // 1:1 tracking, resists past the open edge
  gsap.set(el.rail, { x }); gsap.set(el.scrim, { opacity: 1 + x / railW() });
  d.samples.push([performance.now(), e.clientX]); if (d.samples.length > 5) d.samples.shift();
});
const endDrag = (e) => {
  const d = dragging; if (!d || e.pointerId !== d.id) return; dragging = null;
  if (!d.active) return;
  const a = d.samples[0], b = d.samples[d.samples.length - 1], v = b[0] > a[0] ? ((b[1] - a[1]) / (b[0] - a[0])) * 1000 : 0;
  const x = gsap.getProperty(el.rail, 'x'), projected = x + (v / 1000) * 0.99 / (1 - 0.99);   // project where the flick is heading
  projected < -railW() / 2 ? closeDrawer() : openDrawer();
};
el.rail.addEventListener('pointerup', endDrag);
el.rail.addEventListener('pointercancel', endDrag);

/* ================= purge: delete every log (deliberately hard, human only) ================= */
const W = { dlg: $('#purge'), body: $('#wizBody'), bar: $('#wizSteps'), step: 0, info: null, ch: null, ans: '', pw: '', ids: [], ni: 0, err: '', busy: false, result: null };
const ORDER = ['confirm', 'human', 'password', 'names', 'word', 'done'];
const wpost = async (action, extra = {}) => {
  const r = await fetch('/api/purge', { method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() }, body: JSON.stringify({ action, ...extra }) });
  if (r.status === 401) throw new Error('unauthorized');
  return r.json();
};

function clearAll() {
  S.tasks.clear(); S.agents.clear(); S.rows.clear(); S.stepEls.clear(); S.expanded.clear();
  el.list.innerHTML = ''; el.steps.innerHTML = '';
  S.sel = null; S.maxId = 0; S.filter = ''; S.fsig = ''; S.sig = '';
  history.replaceState(null, '', location.pathname + location.search);
  renderFilter(); updateRuns(); showState('empty');
}

async function openPurge() {
  closeDrawer();
  Object.assign(W, { step: 0, info: null, ch: null, ans: '', pw: '', ids: [], ni: 0, err: '', busy: false, result: null });
  W.dlg.showModal(); renderWiz();
  try { W.info = await wpost('info'); } catch { W.err = '情報を取得できませんでした。'; }
  renderWiz();
}
const wizGo = async (step) => {
  W.step = step; W.err = '';
  if (ORDER[step] === 'human') { W.ch = null; renderWiz(); try { W.ch = await wpost('challenge'); } catch { W.err = '問題を取得できませんでした。'; } }
  if (ORDER[step] === 'names') { W.ni = 0; W.ids = []; if (!W.info.agents.length) return wizGo(step + 1); }
  renderWiz();
};

function renderWiz() {
  const st = ORDER[W.step], n = W.info ? W.info.agents.length : 0;
  W.bar.innerHTML = ORDER.slice(0, 5).map((k, i) => `<li data-state="${i < W.step ? 'done' : i === W.step ? 'current' : 'todo'}"></li>`).join('');
  const err = `<p class="field-error" role="alert">${esc(W.err)}</p>`;
  const act = (back, next, nextHtml, cls = '') => `<div class="wiz-actions">${back}<button class="btn ${cls}" type="button" id="wNext" ${next ? '' : 'disabled'}>${nextHtml}</button></div>`;
  const cancel = `<button class="btn" type="button" data-wiz="cancel">やめる</button>`;
  const back = `<button class="btn" type="button" data-wiz="back">${icon('undo-2')}<span>戻る</span></button>`;
  let html = '', after = null;

  if (st === 'confirm') {
    html = !W.info ? `<p>読み込み中…</p>${err}${act(cancel, false, '続ける')}`
      : `<div class="wiz-warn">${icon('triangle-alert')}<span>保存されているログを、すべて消します。元に戻せません。</span></div>
         <dl class="wiz-count"><div><dt>タスク</dt><dd>${W.info.tasks}</dd></div><div><dt>ステップ</dt><dd>${W.info.steps}</dd></div><div><dt>AI</dt><dd>${W.info.agents.length}</dd></div></dl>
         ${W.info.enabled ? '<p>このあと、4つの確認があります。途中でやめても、何も消えません。</p>' : '<p class="field-error">閲覧用パスワード(VIEW_TOKEN か MCP_TOKEN)が未設定のため、消去できません。Cloudflareのシークレットに設定してください。</p>'}
         ${err}${act(cancel, W.info.enabled, '続ける')}`;
  } else if (st === 'human') {
    html = `<p>人間であることを確認します。次の計算の答えを入力してください。</p>
      <p class="wiz-q num">${W.ch ? esc(W.ch.question) + ' = ?' : '…'}</p>
      <input class="field" id="wIn" inputmode="numeric" autocomplete="off" aria-label="答え" ${W.ch ? '' : 'disabled'}>
      ${err}${act(back, !!W.ch, '確認する')}`;
  } else if (st === 'password') {
    html = `<p>閲覧用パスワードを入力してください。<br>(VIEW_TOKEN。設定していない場合は MCP_TOKEN)</p>
      <input class="field" id="wIn" type="password" autocomplete="off" aria-label="閲覧用パスワード">
      ${err}${act(back, true, '確認する')}`;
  } else if (st === 'names') {
    const a = W.info.agents[W.ni];
    html = `<p><b class="num">${W.ni + 1} / ${n}</b> 薄く出ている AI の名前を、指やマウスでなぞって描いてください。</p>
      <div class="trace" id="trace"><canvas class="tr-guide" role="img" aria-label="${esc(a.name)}"></canvas><canvas class="tr-ink"></canvas></div>
      <div class="trace-meter" id="meter" data-pass="false"><span>なぞれた割合 <b class="num">0%</b>(75%以上)</span><span>はみ出し <b class="num">0%</b>(20%以下)</span></div>
      ${err}<div class="wiz-actions"><span>${back}</span><span class="wiz-actions"><button class="btn" type="button" id="wReset">${icon('eraser')}<span>消してやり直す</span></button><button class="btn" type="button" id="wNext" disabled>${W.ni + 1 < n ? '次のAIへ' : '進む'}</button></span></div>`;
    after = () => {
      const tr = mountTrace($('#trace'), a.name, (m) => {
        const meter = $('#meter'), nums = meter.querySelectorAll('b');
        nums[0].textContent = Math.round(m.coverage * 100) + '%'; nums[1].textContent = Math.round(m.stray * 100) + '%';
        meter.dataset.pass = String(m.pass); $('#wNext').disabled = !m.pass;
      });
      $('#wReset').addEventListener('click', () => tr.reset());
    };
  } else if (st === 'word') {
    html = `<p>最後です。確認のため、半角の小文字で <b>delete</b> と入力してください。貼り付けはできません。</p>
      <input class="field" id="wIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="delete と入力">
      ${err}${act(back, false, `${icon('trash-2')}<span>すべて消去する</span>`, 'danger')}`;
    after = () => {
      const i = $('#wIn');
      for (const t of ['paste', 'drop']) i.addEventListener(t, (e) => e.preventDefault());
      i.addEventListener('input', () => { $('#wNext').disabled = i.value !== 'delete'; });
    };
  } else {
    const r = W.result || {};
    html = `<div class="wiz-warn" style="color:var(--color-success);border-color:var(--color-success);background:var(--color-paper-2)">${icon('shield-check')}<span>すべてのログを消去しました。</span></div>
      <dl class="wiz-count"><div><dt>タスク</dt><dd>${r.tasks ?? 0}</dd></div><div><dt>ステップ</dt><dd>${r.steps ?? 0}</dd></div><div><dt>AI</dt><dd>${r.agents ?? 0}</dd></div></dl>
      <div class="wiz-actions"><span></span><button class="btn" type="button" data-wiz="cancel">閉じる</button></div>`;
  }
  W.body.innerHTML = html;
  after && after();
  $('#wIn')?.focus({ preventScroll: true });
}

async function wizNext() {
  if (W.busy) return; W.busy = true;
  const st = ORDER[W.step], val = $('#wIn')?.value ?? '';
  try {
    if (st === 'confirm') await wizGo(1);
    else if (st === 'human') {
      const r = await wpost('check-human', { challenge: W.ch.challenge, answer: val });
      if (r.ok) { W.ans = val; await wizGo(2); } else { await wizGo(1); W.err = '答えが違います。新しい問題です。'; renderWiz(); }
    } else if (st === 'password') {
      const r = await wpost('check-password', { password: val });
      if (r.ok) { W.pw = val; await wizGo(3); } else { W.err = 'パスワードが違います。'; renderWiz(); }
    } else if (st === 'names') {
      W.ids.push(W.info.agents[W.ni].id); W.ni++;
      if (W.ni >= W.info.agents.length) await wizGo(4); else renderWiz();
    } else if (st === 'word') {
      const r = await wpost('purge', { challenge: W.ch.challenge, answer: W.ans, password: W.pw, word: val, names: W.ids });
      if (r.ok) { W.result = r; W.step = 5; W.err = ''; clearAll(); renderWiz(); }
      else if (r.step === 'names') { W.info = await wpost('info'); await wizGo(3); W.err = 'AIの一覧が変わりました。最初のAIからやり直してください。'; renderWiz(); }
      else if (r.step === 'human') { await wizGo(1); W.err = '時間切れです。もう一度、最初の確認からお願いします。'; renderWiz(); }
      else if (r.step === 'password') { await wizGo(2); W.err = 'パスワードが違います。'; renderWiz(); }
      else { W.err = '消去できませんでした。'; renderWiz(); }
    }
  } catch { W.err = '通信に失敗しました。もう一度お試しください。'; renderWiz(); }
  W.busy = false;
}

W.dlg.addEventListener('click', (e) => {
  const b = e.target.closest('[data-wiz], #wNext, #wizClose'); if (!b) return;
  if (b.id === 'wNext') wizNext();
  else if (b.id === 'wizClose' || b.dataset.wiz === 'cancel') W.dlg.close();
  else if (b.dataset.wiz === 'back') wizGo(Math.max(0, W.step - (ORDER[W.step] === 'word' && !W.info.agents.length ? 2 : 1)));
});
W.dlg.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('#wIn') && !$('#wNext').disabled) { e.preventDefault(); wizNext(); } });
$('#openPurge').addEventListener('click', openPurge);

// trace the AI's name: the guide is drawn faintly, the ink layer is checked against it
function mountTrace(wrap, name, onState) {
  const [guide, ink] = wrap.querySelectorAll('canvas');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = wrap.clientWidth, chh = wrap.clientHeight, pw = Math.round(cw * dpr), ph = Math.round(chh * dpr);
  guide.width = ink.width = pw; guide.height = ink.height = ph;
  const css = getComputedStyle(document.documentElement), tok = (n) => css.getPropertyValue(n).trim();
  const family = getComputedStyle(document.body).fontFamily;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `700 100px ${family}`;
  const size = Math.max(24, Math.min(140, (cw - 48) / (probe.measureText(name).width / 100), chh * 0.62));
  const font = `700 ${size * dpr}px ${family}`;
  const setup = (c) => { c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; };
  const maskOf = (grow) => {
    const c = document.createElement('canvas'); c.width = pw; c.height = ph;
    const x = c.getContext('2d'); setup(x); x.fillStyle = tok('--color-ink'); x.strokeStyle = tok('--color-ink');
    if (grow) { x.lineWidth = grow * dpr; x.strokeText(name, pw / 2, ph / 2); }
    x.fillText(name, pw / 2, ph / 2);
    const d = x.getImageData(0, 0, pw, ph).data, m = new Uint8Array(pw * ph);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 100 ? 1 : 0;
    return m;
  };
  const glyph = maskOf(0), near = maskOf(32), total = glyph.reduce((a, v) => a + v, 0);
  const g = guide.getContext('2d'); setup(g); g.globalAlpha = 0.3; g.fillStyle = tok('--color-ink'); g.fillText(name, pw / 2, ph / 2);
  const x = ink.getContext('2d'); x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = 20 * dpr; x.strokeStyle = tok('--color-error');
  let down = false, last = null;
  const pos = (e) => { const r = ink.getBoundingClientRect(); return [((e.clientX - r.left) * pw) / r.width, ((e.clientY - r.top) * ph) / r.height]; };
  const measure = () => {
    const d = x.getImageData(0, 0, pw, ph).data; let covered = 0, drawn = 0, inside = 0;
    for (let i = 0; i < glyph.length; i++) if (d[i * 4 + 3] > 60) { drawn++; if (near[i]) inside++; if (glyph[i]) covered++; }
    const coverage = total ? covered / total : 0, stray = drawn ? 1 - inside / drawn : 0;
    onState({ coverage, stray, pass: coverage >= 0.75 && stray <= 0.2 });
  };
  ink.addEventListener('pointerdown', (e) => { down = true; ink.setPointerCapture(e.pointerId); last = pos(e); x.beginPath(); x.moveTo(...last); x.lineTo(last[0] + 0.01, last[1]); x.stroke(); });
  ink.addEventListener('pointermove', (e) => { if (!down) return; const p = pos(e); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last = p; });
  const end = () => { if (down) { down = false; measure(); } };
  ink.addEventListener('pointerup', end); ink.addEventListener('pointercancel', end);
  return { reset() { x.clearRect(0, 0, pw, ph); onState({ coverage: 0, stray: 0, pass: false }); } };
}

/* ---- how many tasks are running right now (all AIs) ---- */
function updateRuns() {
  const n = [...S.tasks.values()].filter((t) => t.status === 'running').length;
  $('#runs').hidden = n === 0;
  $('#runs').innerHTML = n ? `${icon('loader-circle', 'spin')}<span><span class="num">${n}</span>件実行中</span>` : '';
}

/* ================= live clocks ================= */
setInterval(() => {
  if (document.hidden) return;
  const n = nowMs();
  document.querySelectorAll('.live').forEach((n0) => {
    const k = n0.dataset.kind, t0 = Number(n0.dataset.t0);
    if (k === 'elapsed') n0.textContent = clock((Number(n0.dataset.t1) || n) - t0);
    else if (k === 'since') n0.textContent = clock(n - t0);
    else if (k === 'ago') n0.textContent = clock(n - t0) + '前';
  });
  for (const [id, li] of S.rows) {
    const t = S.tasks.get(id), b = li.firstElementChild;
    const stale = t.status === 'running' && n - t.updatedAt > 90000;
    if (stale !== b.hasAttribute('data-stale')) { stale ? b.setAttribute('data-stale', '') : b.removeAttribute('data-stale'); b.title = stale ? '90秒以上、更新がありません' : ''; }
  }
  const idle = $('#idle');
  if (idle) {
    const age = n - Number(idle.dataset.t0);
    idle.hidden = age < 90000;
    if (!idle.hidden) idle.querySelector('b').textContent = clock(age);
  }
}, 1000);

/* ================= go ================= */
setConn('connecting');
applyOrder(); applySound();
syncDrawer(); boot();   // gsap is deferred, so it is ready by DOMContentLoaded; without it the viewer still works, just without motion
});
