<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f9fa">
<meta name="description" content="終わった作業を、時間軸に沿って巻き戻したり早送りしたりしながら見直せる Workline のリプレイ画面。">
<title>Workline リプレイ</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen (playback) · same system as the viewer (/): tokens, type, radii, buttons and the lane/ledger vocabulary are shared with it, not restyled
 * signature: the lanes on a real-time axis, now scrubbable. The playhead is the only thing that moves; everything else is a pure function of the playhead time.
 * states: loading, locked, error, picker, empty, playing, paused, ended */
:root {
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --z-base: 1; --z-raised: 10; --z-sticky: 200; --z-drawer: 300; --z-scrim: 250;

  --color-paper: oklch(98.5% 0.004 235);
  --color-paper-2: oklch(96.2% 0.006 235);
  /* 作業の種類ごとの色(白いアイコンを載せても3:1以上になる明度) */
  --k-plan: oklch(50% 0.15 275); --k-think: oklch(50% 0.16 315); --k-search: oklch(52% 0.11 205); --k-read: oklch(52% 0.12 135);
  --k-write: oklch(55% 0.14 60); --k-run: oklch(52% 0.17 28); --k-web: oklch(52% 0.15 245); --k-check: oklch(50% 0.11 170);
  --k-fix: oklch(54% 0.12 95); --k-wait: oklch(54% 0.03 250); --k-note: oklch(55% 0.01 250);
  --color-paper-3: oklch(93.2% 0.008 235);
  --color-ink: oklch(23% 0.02 250);
  --color-ink-2: oklch(40% 0.02 250);
  --color-muted: oklch(47% 0.016 250);
  --color-rule: oklch(90% 0.008 240);
  --color-accent: oklch(50% 0.115 205);
  --color-accent-ink: oklch(98.5% 0.004 235);
  --color-accent-soft: oklch(94.5% 0.035 205);
  --color-focus: oklch(50% 0.115 205);
  --color-success: oklch(48% 0.12 150);
  --color-error: oklch(52% 0.19 27);
  --color-error-soft: oklch(96% 0.03 27);
  --color-warn: oklch(46% 0.12 70);
  --color-warn-soft: oklch(96% 0.05 85);
  --color-warn-rule: oklch(80% 0.12 85);
  --color-av-0: oklch(42% 0.1 205); --color-av-0-bg: oklch(93% 0.04 205);
  --color-av-1: oklch(40% 0.1 150); --color-av-1-bg: oklch(93% 0.04 150);
  --color-av-2: oklch(42% 0.12 40); --color-av-2-bg: oklch(93% 0.04 40);
  --color-av-3: oklch(42% 0.11 300); --color-av-3-bg: oklch(93% 0.04 300);
  --color-av-4: oklch(42% 0.1 85); --color-av-4-bg: oklch(93% 0.05 85);
  --color-av-5: oklch(42% 0.12 350); --color-av-5-bg: oklch(93% 0.04 350);
  --color-glass: color-mix(in oklab, var(--color-paper) 80%, transparent);
  --color-scrim: color-mix(in oklab, var(--color-ink) 38%, transparent);
  --shadow-sheet: 0 10px 20px -12px color-mix(in oklab, var(--color-ink) 38%, transparent);

  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-display: var(--font-body);
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius-card: 12px; --radius-ctl: 8px; --radius-pill: 999px; --rule-hair: 1px;
  --bar-h: 52px; --rail-w: 19rem; --measure: 58rem;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: calc(var(--bar-h) + 140px); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.6; word-break: auto-phrase; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: var(--color-accent); text-decoration-thickness: 1px; text-underline-offset: 0.16em; overflow-wrap: anywhere; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
h1, h2, h3 { font-family: var(--font-display); font-synthesis: none; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { text-wrap: pretty; }
svg { display: block; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spin { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { *:not(.keep-motion), *:not(.keep-motion)::before, *:not(.keep-motion)::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }

.skip { position: absolute; left: var(--space-sm); top: -48px; z-index: var(--z-drawer); padding: var(--space-xs) var(--space-sm); background: var(--color-ink); color: var(--color-paper); border-radius: var(--radius-ctl); }
.skip:focus-visible { top: var(--space-xs); }

.bar { position: sticky; top: 0; z-index: var(--z-sticky); height: var(--bar-h); display: flex; align-items: center; gap: var(--space-xs); padding-inline: var(--space-md); background: var(--color-glass); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border-bottom: var(--rule-hair) solid var(--color-rule); }
.brand { display: flex; align-items: center; gap: var(--space-xs); font-weight: 700; font-size: var(--text-md); letter-spacing: 0; }
.brand .ic { width: 20px; height: 20px; color: var(--color-accent); }
.bar-spacer { flex: 1; }

.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--color-ink-2); cursor: pointer; transition: background var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.icon-btn:hover { background: var(--color-paper-3); color: var(--color-ink); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn[aria-pressed="true"] { box-shadow: inset 0 0 0 var(--rule-hair) var(--color-accent); color: var(--color-accent); }
.icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn .ic { width: 20px; height: 20px; }

.chip { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 32px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-paper); color: var(--color-ink-2); font-size: var(--text-xs); cursor: pointer; transition: background var(--dur-micro), color var(--dur-micro), transform var(--dur-micro) var(--ease-out); }
.chip:hover { background: var(--color-paper-3); }
.chip:active { transform: scale(0.96); }
.chip[aria-pressed="true"] { background: var(--color-accent-soft); border-color: var(--color-accent); color: var(--color-accent); }

.av { --av: 20px; position: relative; display: inline-grid; place-items: center; flex: none; width: var(--av); height: var(--av); border-radius: var(--radius-ctl); overflow: hidden; font-size: calc(var(--av) * 0.52); font-weight: 700; line-height: 1; background: var(--color-av-0-bg); color: var(--color-av-0); }
.av[data-t="1"] { background: var(--color-av-1-bg); color: var(--color-av-1); }
.av[data-t="2"] { background: var(--color-av-2-bg); color: var(--color-av-2); }
.av[data-t="3"] { background: var(--color-av-3-bg); color: var(--color-av-3); }
.av[data-t="4"] { background: var(--color-av-4-bg); color: var(--color-av-4); }
.av[data-t="5"] { background: var(--color-av-5-bg); color: var(--color-av-5); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--color-paper); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 40px; padding: 0 var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); color: var(--color-ink); font-size: var(--text-sm); cursor: pointer; transition: background var(--dur-micro), border-color var(--dur-micro), color var(--dur-micro), transform var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-paper-3); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn.primary:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); }
.btn.small { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-xs); }

.field { width: 100%; min-height: 40px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); }
.field:hover { border-color: var(--color-muted); }
.field[aria-invalid="true"] { border-color: var(--color-error); }
.field-error { min-height: 1lh; font-size: var(--text-sm); color: var(--color-error); }
.f-ta, .f-in, .f-sel { width: 100%; padding: var(--space-xs) var(--space-sm); font: inherit; color: inherit; background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); }
.f-in, .f-sel { min-height: 40px; }
.f-ta:hover, .f-in:hover, .f-sel:hover { border-color: var(--color-muted); }
.f-ta:focus-visible, .f-in:focus-visible, .f-sel:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

.state { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-sm); max-width: 36rem; padding-top: var(--space-xl); }
.state > .ic { width: 28px; height: 28px; color: var(--color-muted); }
.state h1 { font-size: var(--text-xl); line-height: 1.3; }
.state p { color: var(--color-ink-2); }
.state form { display: flex; flex-direction: column; gap: var(--space-xs); width: 100%; }
.state label { font-size: var(--text-sm); font-weight: 500; }


/* ---- replay: the same system as the viewer. the page is a fixed-height app, so the bar does not stick ---- */
.app { height: 100dvh; display: grid; grid-template-rows: var(--bar-h) minmax(0, 1fr); }
.app > .bar { position: relative; }
.page-t { margin: 0; padding-left: var(--space-sm); border-left: var(--rule-hair) solid var(--color-rule); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); white-space: nowrap; }
.bar .sel { flex: 1; min-width: 0; max-width: 34rem; margin-left: var(--space-xs); text-overflow: ellipsis; }
a.btn, a.icon-btn { text-decoration: none; }
.btn .ic.lg { width: 20px; height: 20px; }
.btn.ico { width: 40px; padding: 0; }
.btn.big { min-width: 48px; min-height: 48px; padding: 0 var(--space-md); }

.body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, 22rem); grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.stage { grid-column: 1; grid-row: 1; min-height: 0; overflow: auto; padding: var(--space-md) var(--space-lg); display: grid; gap: var(--space-sm); align-content: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); }

/* ---- a lane = the "now" panel of the viewer, one per AI ---- */
.lane { display: flex; flex-direction: column; gap: var(--space-sm); min-width: 0; padding: var(--space-md) var(--space-lg); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); transition: border-color var(--dur-micro); }
.lane[data-st="running"] { border-color: var(--color-accent); box-shadow: var(--shadow-sheet); }
.lane[data-st="done"] { border-color: var(--color-success); background: var(--color-paper-2); }
.lane[data-st="failed"] { border-color: var(--color-error); background: var(--color-paper-2); }
.lane[data-st="cancelled"] { background: var(--color-paper-2); }
.lane[data-st="pending"] { background: var(--color-paper-2); opacity: 0.55; }
.lw { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; }
.lw .av { --av: 32px; }
.lw .n { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lw .n b { font-size: var(--text-sm); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lw .n span { font-size: var(--text-xs); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lw .s { flex: none; display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.lw .s::before { content: ""; width: 8px; height: 8px; border-radius: var(--radius-pill); background: currentColor; }
.lane[data-st="running"] .lw .s { color: var(--color-accent); }
.lane[data-st="running"] .lw .s::before { animation: pulse 1.6s ease-in-out infinite; }
.lane[data-st="done"] .lw .s { color: var(--color-success); }
.lane[data-st="failed"] .lw .s { color: var(--color-error); }
.nowt { display: flex; align-items: flex-start; gap: var(--space-sm); min-height: calc(var(--text-xl) * 2.7); font-size: var(--text-xl); font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
@media (max-width: 40rem) { .nowt { font-size: var(--text-lg); min-height: calc(var(--text-lg) * 2.7); } }
.nowt .nt { min-width: 0; }
.nowt .prev { display: block; font-size: var(--text-xs); font-weight: 400; color: var(--color-muted); }
.kn { --kc: var(--k-note); flex: none; display: grid; place-items: center; width: 28px; height: 28px; margin-top: var(--space-3xs); border-radius: var(--radius-pill); background: var(--kc); color: #fff; }
.kn .ic { width: 15px; height: 15px; }
.nowt .none { color: var(--color-muted); }
.lane[data-st="done"] .nowt .nt, .lane[data-st="cancelled"] .nowt .nt { color: var(--color-ink-2); }
.kn[data-k="plan"], .ev[data-sk="plan"] .nd { --kc: var(--k-plan); }
.kn[data-k="think"], .ev[data-sk="think"] .nd { --kc: var(--k-think); }
.kn[data-k="search"], .ev[data-sk="search"] .nd { --kc: var(--k-search); }
.kn[data-k="read"], .ev[data-sk="read"] .nd { --kc: var(--k-read); }
.kn[data-k="write"], .ev[data-sk="write"] .nd { --kc: var(--k-write); }
.kn[data-k="run"], .ev[data-sk="run"] .nd { --kc: var(--k-run); }
.kn[data-k="web"], .ev[data-sk="web"] .nd { --kc: var(--k-web); }
.kn[data-k="check"], .ev[data-sk="check"] .nd { --kc: var(--k-check); }
.kn[data-k="fix"], .ev[data-sk="fix"] .nd { --kc: var(--k-fix); }
.kn[data-k="wait"], .ev[data-sk="wait"] .nd { --kc: var(--k-wait); }
.kn[data-k="note"], .ev[data-sk="note"] .nd { --kc: var(--k-note); }
.ask { display: flex; gap: var(--space-xs); align-items: flex-start; padding: var(--space-xs) var(--space-sm); border: var(--rule-hair) solid var(--color-warn-rule); border-radius: var(--radius-ctl); background: var(--color-warn-soft); color: var(--color-warn); font-size: var(--text-sm); }
.ask .ic { margin-top: var(--space-2xs); }
.cnt { display: flex; align-items: center; justify-content: space-between; gap: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
.cnt .c1 { font-family: var(--font-data); }
.c2 { padding: 0 var(--space-xs); border-radius: var(--radius-ctl); background: var(--color-av-0-bg); color: var(--color-av-0); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.7; }
.c2:empty { display: none; }
.lane[data-t="0"] .c2 { background: var(--color-av-0-bg); color: var(--color-av-0); }
.lane[data-t="1"] .c2 { background: var(--color-av-1-bg); color: var(--color-av-1); }
.lane[data-t="2"] .c2 { background: var(--color-av-2-bg); color: var(--color-av-2); }
.lane[data-t="3"] .c2 { background: var(--color-av-3-bg); color: var(--color-av-3); }
.lane[data-t="4"] .c2 { background: var(--color-av-4-bg); color: var(--color-av-4); }
.lane[data-t="5"] .c2 { background: var(--color-av-5-bg); color: var(--color-av-5); }

/* ---- the event log: the viewer's ledger, read-only ---- */
.log { grid-column: 2; grid-row: 1 / span 2; min-height: 0; display: flex; flex-direction: column; background: var(--color-paper-2); border-left: var(--rule-hair) solid var(--color-rule); }
.log h2 { padding: var(--space-md) var(--space-md) var(--space-xs); font-size: var(--text-sm); font-weight: 700; color: var(--color-ink-2); }
.log ol { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-3xs); padding: var(--space-xs); list-style: none; scroll-behavior: auto; }
.ev { --kc: var(--color-rule); display: grid; grid-template-columns: 3.1rem 24px minmax(0, 1fr); gap: var(--space-xs); align-items: start; width: 100%; padding: var(--space-xs) var(--space-sm); border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--color-ink-2); font-size: var(--text-sm); text-align: left; cursor: pointer; transition: background var(--dur-micro), transform var(--dur-micro) var(--ease-out); }
.ev:hover { background: var(--color-paper-3); }
.ev:active { transform: scale(0.985); }
.ev .tm { padding-top: var(--space-3xs); font-family: var(--font-data); font-size: var(--text-xs); color: var(--color-muted); text-align: right; }
.ev .nd { display: grid; place-items: center; width: 24px; height: 24px; border: 1.5px solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-paper); color: var(--color-ink-2); }
.ev .nd .ic { width: 13px; height: 13px; }
.ev[data-sk] .nd { border-color: var(--kc); background: var(--kc); color: #fff; }
.ev[data-k="ask"] .nd { border-color: var(--color-warn-rule); background: var(--color-warn-soft); color: var(--color-warn); }
.ev[data-k="fail"] .nd { border-color: var(--color-error); background: var(--color-error-soft); color: var(--color-error); }
.ev .tx { min-width: 0; padding-top: var(--space-3xs); overflow-wrap: anywhere; line-height: 1.5; }
.ev .tx small { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.ev[data-k="ask"] .tx { color: var(--color-warn); }
.ev[data-k="fail"] .tx { color: var(--color-error); }
.ev[data-last="1"] { background: var(--color-accent-soft); color: var(--color-ink); }
.ev img { display: block; margin-top: var(--space-2xs); max-width: 100%; max-height: 7rem; border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); }
.log .none { padding: var(--space-lg) var(--space-md); color: var(--color-muted); font-size: var(--text-sm); }

/* ---- dock: scrubber + controls ---- */
.dock { grid-column: 1; grid-row: 2; display: grid; gap: var(--space-sm); padding: var(--space-sm) var(--space-lg) max(var(--space-md), env(safe-area-inset-bottom)); border-top: var(--rule-hair) solid var(--color-rule); background: var(--color-paper); }
.scrub { position: relative; height: var(--th, 120px); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper-2); overflow: hidden; cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; }
.scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scrub .head { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; background: var(--color-accent); pointer-events: none; will-change: transform; }
.scrub .head::before { content: ""; position: absolute; top: 0; left: -5px; width: 12px; height: 8px; background: var(--color-accent); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.scrub:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

const ic = (k) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[k] || IC.note}</svg>`;

const ST = { running: '作業中', done: '完了', failed: '失敗', cancelled: '中断', pending: '開始前' };
const tintOf = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 6; };
const p2 = (n) => String(n).padStart(2, '0');
const fmt = (ms) => { const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + p2(m) : p2(m)) + ':' + p2(s % 60); };

const S = { token: store.get('token', ''), snap: null, root: null, tasks: [], steps: [], events: [], agents: [], lanes: new Map(), t0: 0, t1: 1, T: 0, playing: false, speed: Number(store.get('replay.speed', '4')), skip: store.get('replay.skip', '1') === '1', shown: 0, laneKey: '' };
const SPEEDS = [1, 2, 4, 8, 16, 32];

/* ---------- load ---------- */
const url = new URL(location.href);
const qt = url.searchParams.get('token'); if (qt) { S.token = qt; store.set('token', qt); url.searchParams.delete('token'); history.replaceState(null, '', url.pathname + url.search + url.hash); }

/* ---------- build the event model for one session ---------- */
function build(root, keepPos) {

  const ev = [], steps = [];
  for (const t of tree) {
    ev.push({ at: t.startedAt, k: 'start', agent: agentOf(t.agent), text: t.parentId == null ? `「${t.title}」を始めました` : `子タスク「${t.title}」を始めました`, icon: 'flag' });
    if (t.status !== 'running' && t.finishedAt) ev.push({ at: t.finishedAt, k: t.status === 'failed' ? 'fail' : 'end', agent: agentOf(t.agent), text: `${t.parentId == null ? '' : '子タスク '}${{ done: '完了しました', failed: '失敗しました', cancelled: '中断されました' }[t.status] || '終わりました'}`, sub: t.summary || t.result || '', icon: 'flag' });

  for (const d of snap.directives || []) {
    if (!(ids.has(d.taskId) || ids.has(d.childTaskId) || d.rootTaskId === root.id)) continue;
    const at = tms(d.createdAt); if (at) ev.push({ at, k: 'dir', agent: d.from, text: `${d.kind === 'request' ? '要求' : '司令'}: ${d.title}`, sub: `${aName(d.from)} → ${aName(d.to)}`, icon: 'send' });
  }
  for (const sh of snap.shots || []) { const at = tms(sh.createdAt); if (at && sh.taskId != null && ids.has(sh.taskId)) ev.push({ at, k: 'shot', agent: sh.by, text: sh.caption || 'スクリーンショット', icon: 'image', shot: sh.shotId }); }
  ev.sort((a, b) => a.at - b.at);
  S.tasks = tree; S.steps = steps; S.events = ev;
  const agents = [...new Set([...tree.map((t) => t.agent), ...steps.map((s) => s.agent)].filter(Boolean))];
  S.agents = agents.length ? agents : [root.agent || 'AI'];
  S.t0 = Math.min(root.startedAt, ...(ev.length ? [ev[0].at] : [root.startedAt]));
  const running = tree.some((t) => t.status === 'running');
  S.t1 = Math.max(S.t0 + 1000, ...ev.map((e) => e.at), ...tree.map((t) => t.finishedAt || 0), running ? now : 0);
  S.running = running;
  // 一瞬で記録されたステップ(開始と終了がほぼ同時)は、同じAIの次のステップが始まるまで「やっていた」ものとして、帯の長さを決める
  for (const id of S.agents) {
    const mine = steps.filter((x) => x.agent === id).sort((a, b) => a.createdAt - b.createdAt || a.id - b.id);
    const taskEnd = Math.max(0, ...tree.filter((t) => t.agent === id && t.status !== 'running').map((t) => t.finishedAt || 0));
    mine.forEach((x, i) => {
      const own = x.endedAt && x.endedAt - x.createdAt >= 1500 ? x.endedAt : null;
      const nx = mine[i + 1] ? mine[i + 1].createdAt : taskEnd || (running ? S.t1 : x.endedAt || x.updatedAt || x.createdAt);
      x.visEnd = Math.max(x.createdAt + 300, own || Math.min(nx, x.createdAt + 10 * 60000));
    });
  }
  const at = Number(url.searchParams.get('at'));
  const keep = keepPos ? S.T : null;
  S.T = keep != null ? Math.min(keep, S.t1) : url.searchParams.has('at') && Number.isFinite(at) ? S.t0 + Math.min(Math.max(0, at * 1000), S.t1 - S.t0) : S.t0;
  S.shown = 0; S.laneKey = ''; S.lanes.clear(); $('#stage').innerHTML = ''; $('#log').innerHTML = '';
  $('#state').hidden = true; $('#body').hidden = false; $('#bLink').hidden = false;
  $('#back').href = `/#t=${root.id}`;
  document.title = `リプレイ · ${root.title} · Workline`;
  sizeTrack(); paint(true);
  const auto = url.searchParams.get('play') === '1' && !url.searchParams.has('at') && !keepPos;
  if (auto && S.events.length) play(true); else setPlaying(false);
}

/* ---------- state at time T ---------- */
function laneAt(agent, T) {
  const mine = S.steps.filter((s) => s.agent === agent && s.createdAt <= T).sort((a, b) => a.createdAt - b.createdAt || a.id - b.id);
  const tasks = S.tasks.filter((t) => t.agent === agent);
  const started = tasks.filter((t) => t.startedAt <= T), ended = started.length && started.every((t) => t.status !== 'running' && t.finishedAt && t.finishedAt <= T);
  let st = 'pending';
  if (started.length) st = ended ? (started.some((t) => t.status === 'failed') ? 'failed' : started.every((t) => t.status === 'cancelled') ? 'cancelled' : 'done') : 'running';
  const runningStep = [...mine].reverse().find((s) => T < s.visEnd);
  const cur = runningStep || mine[mine.length - 1] || null;
  const ask = (S.snap.approvals || []).filter((a) => a.createdAt <= T && !(a.answeredAt && a.answeredAt <= T) && (a.from === agent || tasks.some((t) => t.id === a.taskId))).pop();
  return { st, cur, active: !!runningStep, n: mine.length, total: S.steps.filter((s) => s.agent === agent).length, ask, task: started[started.length - 1] || tasks[0] };
}
const agentRow = (id) => S.snap.agents.find((a) => a.id === id) || { id, name: id };

/* ---------- paint ---------- */
let lastLog = -1;
function paint(force) {
  const T = S.T, span = S.t1 - S.t0;
  $('#head').style.transform = `translateX(${(((T - S.t0) / span) * trackW()).toFixed(1)}px)`;
  $('#time').innerHTML = `${fmt(T - S.t0)} / ${fmt(span)} <small>${wallClock(T)}</small>`;
  const tr = $('#track'); tr.setAttribute('aria-valuenow', Math.round(((T - S.t0) / span) * 100)); tr.setAttribute('aria-valuetext', `${fmt(T - S.t0)}(全体 ${fmt(span)})`);
  drawTrack();
  paintLanes(force); paintLog(force);
}
function paintLanes(force) {
  const stage = $('#stage'), T = S.T, key = S.agents.join('|');
  if (S.laneKey !== key) {
    S.laneKey = key; stage.innerHTML = ''; S.lanes.clear();
    for (const id of S.agents) {
      const el = document.createElement('article'); el.className = 'lane'; el.dataset.t = tintOf(id);
      el.innerHTML = `<div class="lw"><span class="av" data-t="${tintOf(id)}" aria-hidden="true"><span></span></span><div class="n"><b></b><span></span></div><div class="s"></div></div><div class="nowt"></div><div class="ask" hidden>${ic('ask')}<span></span></div><div class="cnt"><span class="c1"></span><span class="c2"></span></div>`;
      stage.appendChild(el);
      const a = agentRow(id), av = $('.av', el); $('.av > span', el).textContent = ([...(a.name || '?')][0] || '?').toUpperCase();
      if (a.hasIcon) { const img = new Image(); img.alt = ''; img.src = `/api/icon?agent=${encodeURIComponent(a.id)}${S.token ? '&token=' + encodeURIComponent(S.token) : ''}`; img.onload = () => av.appendChild(img); }
      $('.n b', el).textContent = a.name || id; $('.n > span', el).textContent = [a.model].filter(Boolean).join(' · ');
      S.lanes.set(id, { el, sig: '' });
    }
  }
  for (const [id, l] of S.lanes) {
    const m = laneAt(id, T), el = l.el, sig = `${m.st}|${m.cur && m.cur.id}|${m.active}|${m.n}|${m.ask && m.ask.requestId}`;
    if (sig === l.sig && !force) continue;
    const swap = l.sig && l.cur !== (m.cur && m.cur.id); l.sig = sig; l.cur = m.cur && m.cur.id;
    el.dataset.st = m.st; el.dataset.ask = m.ask ? '1' : '0';
    $('.s', el).textContent = ST[m.st];
    const nt = $('.nowt', el);
    nt.innerHTML = m.cur ? `<span class="kn" data-k="${esc(m.cur.kind)}">${ic(m.cur.kind)}</span><span class="nt">${m.active ? '' : '<span class="prev">直前</span>'}${esc(m.cur.title)}</span>` : `<span class="nt none">${m.st === 'pending' ? 'まだ始まっていません' : '—'}</span>`;
    if (swap && playing() && motion()) gsap.fromTo(nt, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: 'expo.out', clearProps: 'all' });
    const ab = $('.ask', el); ab.hidden = !m.ask; if (m.ask) $('span', ab).textContent = '確認待ち: ' + m.ask.question;
    $('.c1', el).textContent = `${m.n} / ${m.total} ステップ`; $('.c2', el).textContent = m.task ? `#${m.task.agentNumber || '00'}` : '';
  }
}
function paintLog(force) {
  const T = S.T, ev = S.events; let n = 0; { let lo = 0, hi = ev.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (ev[mid].at <= T) lo = mid + 1; else hi = mid; } n = lo; }
  if (n === lastLog && !force) return;
  const ol = $('#log'); const stick = ol.scrollTop + ol.clientHeight >= ol.scrollHeight - 40 || force || n < lastLog;
  const from = Math.max(0, n - 300);
  const item = (e, i) => `<li><button class="ev" type="button" data-i="${i}" data-k="${e.k}"${e.k === 'step' && e.kind ? ` data-sk="${esc(e.kind)}"` : ''} aria-label="この時点へ移動"><span class="tm">${fmt(e.at - S.t0)}</span><span class="nd">${ic(e.icon)}</span><span class="tx">${e.who ? `<small>${esc(e.who)}</small>` : ''}${e.label ? `<small>${esc(agentRow(e.agent).name || e.agent)} · ${esc(e.label)}</small>` : ''}${esc(e.text)}${e.sub ? `<small>${esc(e.sub)}</small>` : ''}${e.shot ? `<img alt="" loading="lazy" src="/api/shot?id=${e.shot}${S.token ? '&token=' + encodeURIComponent(S.token) : ''}">` : ''}</span></button></li>`;
  if (force || n < lastLog || lastLog < 0 || n - lastLog > 40 || from > 0) {
    ol.innerHTML = n ? ev.slice(from, n).map((e, j) => item(e, from + j)).join('') : `<li class="none">まだ何も起きていません。再生を押すか、下のバーをなぞってください。</li>`;
  } else {
    const add = ev.slice(lastLog, n); ol.querySelector('.none')?.remove();
    ol.insertAdjacentHTML('beforeend', add.map((e, j) => item(e, lastLog + j)).join(''));
    if (playing() && motion()) for (const li of [...ol.children].slice(-add.length)) gsap.from(li, { x: -10, opacity: 0, duration: 0.35, ease: 'expo.out', clearProps: 'all' });
  }
  ol.querySelectorAll('[data-last]').forEach((b) => b.removeAttribute('data-last')); const lb = ol.querySelector('li:last-child .ev'); if (lb) lb.dataset.last = '1';
  lastLog = n; if (stick) ol.scrollTop = ol.scrollHeight;
}
$('#log').addEventListener('click', (e) => { const b = e.target.closest('.ev'); if (!b) return; const ev = S.events[Number(b.dataset.i)]; if (ev) { setPlaying(false); seek(ev.at); } });

/* ---------- timeline canvas ---------- */
const cv = $('#cv'), track = $('#track'); let dpr = 1, W = 0, H = 0;
const trackW = () => W || track.clientWidth;
function sizeTrack() {
  const rows = S.agents.length, rowH = 22, ruler = 22;
  track.style.setProperty('--th', Math.min(260, Math.max(96, ruler + rows * (rowH + 6) + 10)) + 'px');
  dpr = Math.min(2, window.devicePixelRatio || 1); W = track.clientWidth; H = track.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
function drawTrack() {
  const g = cv.getContext('2d'); if (!g || !W) return; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();
  const rule = v('--color-rule'), muted = v('--color-muted'), err = v('--color-error'), ink = v('--color-ink-2'), accent = v('--color-accent'), warn = v('--color-warn'), lane = v('--color-paper-3');
  const span = S.t1 - S.t0, x = (t) => ((t - S.t0) / span) * W, ruler = 22, rowH = 22, gap = 6;
  const rr = (px, py, pw, ph, r) => { g.beginPath(); if (g.roundRect) g.roundRect(px, py, pw, ph, r); else g.rect(px, py, pw, ph); g.fill(); };
  g.font = '11px "JetBrains Mono", ui-monospace, monospace'; g.textBaseline = 'middle';
  const nice = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400].map((s) => s * 1000); const step = nice.find((n) => span / n <= Math.max(3, W / 90)) || nice[nice.length - 1];
  g.strokeStyle = rule; g.fillStyle = muted; g.lineWidth = 1;
  for (let t = 0; t <= span + 1; t += step) { const px = Math.round(x(S.t0 + t)) + 0.5; g.beginPath(); g.moveTo(px, ruler - 5); g.lineTo(px, H); g.stroke(); g.fillText(fmt(t), Math.min(px + 4, W - 48), ruler / 2); }
  S.agents.forEach((id, i) => {
    const y = ruler + i * (rowH + gap) + 4;
    g.fillStyle = lane; rr(0, y, W, rowH, 4);
    for (const s of S.steps) {
      if (s.agent !== id) continue;
      const a = x(s.createdAt), b = Math.max(a + 3, x(s.visEnd)), live = s.createdAt <= S.T && S.T < s.visEnd, w = Math.max(2, b - a - 2);
      g.globalAlpha = s.createdAt > S.T ? 0.3 : live ? 1 : 0.85; g.fillStyle = s.status === 'failed' ? err : v('--k-' + (s.kind || 'note')) || v('--k-note'); rr(a, y + 2, w, rowH - 4, 3);
      if (live) { g.globalAlpha = 1; g.strokeStyle = accent; g.lineWidth = 2; g.beginPath(); if (g.roundRect) g.roundRect(a - 1, y + 1, w + 2, rowH - 2, 4); else g.rect(a - 1, y + 1, w + 2, rowH - 2); g.stroke(); g.lineWidth = 1; }
    }
    g.globalAlpha = 1;
    for (const t of S.tasks) { if (t.agent !== id) continue; g.fillStyle = ink; g.fillRect(x(t.startedAt), y, 2, rowH); if (t.status !== 'running' && t.finishedAt) { g.fillStyle = t.status === 'failed' ? err : muted; g.fillRect(x(t.finishedAt) - 2, y, 2, rowH); } }
  });
  for (const e of S.events) if (e.k === 'ask') { const px = x(e.at); g.fillStyle = warn; g.beginPath(); g.moveTo(px, H - 2); g.lineTo(px - 4, H - 10); g.lineTo(px + 4, H - 10); g.closePath(); g.fill(); }
}
addEventListener('resize', () => { if (!S.root) return; sizeTrack(); paint(false); });

/* ---------- scrubbing ---------- */
let drag = false;
const posToTime = (clientX) => { const r = track.getBoundingClientRect(); return S.t0 + Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * (S.t1 - S.t0); };
track.addEventListener('pointerdown', (e) => { drag = true; wasPlaying = S.playing; setPlaying(false); track.setPointerCapture(e.pointerId); seek(posToTime(e.clientX)); });
let wasPlaying = false;
track.addEventListener('pointermove', (e) => {
  if (drag) { seek(posToTime(e.clientX)); return; }
  const r = track.getBoundingClientRect(), t = posToTime(e.clientX), row = Math.floor((e.clientY - r.top - 26) / 28), id = S.agents[row];
  const hit = id && S.steps.find((s) => s.agent === id && s.createdAt <= t && t < s.visEnd);
  const tip = $('#tip'); if (hit) { tip.hidden = false; tip.textContent = `${KL[hit.kind] || ''} · ${hit.title}`; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, e.clientX - r.left + 10)) + 'px'; tip.style.top = Math.max(2, e.clientY - r.top - 30) + 'px'; } else tip.hidden = true;
});
track.addEventListener('pointerleave', () => { $('#tip').hidden = true; });
const endDrag = () => { if (!drag) return; drag = false; if (wasPlaying && S.T < S.t1) play(); };
track.addEventListener('pointerup', endDrag); track.addEventListener('pointercancel', endDrag);
function seek(t) { S.T = Math.min(S.t1, Math.max(S.t0, t)); paint(false); syncUrl(); }
const nextEvent = () => S.events.find((e) => e.at > S.T + 1), prevEvent = () => [...S.events].reverse().find((e) => e.at < S.T - 400);

/* ---------- playback ---------- */
const playing = () => S.playing;
let raf = 0, last = 0;
function setPlaying(on) {
  S.playing = on; cancelAnimationFrame(raf); last = 0;
  $('#icPlay').innerHTML = on ? IC.pause : IC.play; $('#bPlay').setAttribute('aria-label', on ? '一時停止' : S.T >= S.t1 ? 'もう一度再生' : '再生');
  if (on) raf = requestAnimationFrame(tick); else syncUrl();
}
function play(fromStart) { if (fromStart || S.T >= S.t1) S.T = S.t0; setPlaying(true); }
function tick(ts) {
  if (!S.playing) return;
  const dt = last ? Math.min(100, ts - last) : 0; last = ts;
  let rate = S.speed;
  if (S.skip) { const nx = nextEvent(); const gap = nx ? nx.at - S.T : S.t1 - S.T; if (gap > 4000 * S.speed) rate = Math.max(rate, gap); } // 何も起きていない間は、約1秒で飛ばす
  S.T = Math.min(S.t1, S.T + dt * rate);
  paint(false);
  if (S.T >= S.t1) { setPlaying(false); $('#bPlay').setAttribute('aria-label', 'もう一度再生'); return; }
  raf = requestAnimationFrame(tick);
}
$('#bPlay').addEventListener('click', () => (S.playing ? setPlaying(false) : play()));
$('#bStart').addEventListener('click', () => { setPlaying(false); seek(S.t0); });
$('#bEnd').addEventListener('click', () => { setPlaying(false); seek(S.t1); });
$('#bNext').addEventListener('click', () => { const e = nextEvent(); setPlaying(false); seek(e ? e.at : S.t1); });
$('#bPrev').addEventListener('click', () => { const e = prevEvent(); setPlaying(false); seek(e ? e.at : S.t0); });
function paintSpeed() { $('#speed').innerHTML = SPEEDS.map((v) => `<button class="chip" type="button" data-v="${v}" aria-pressed="${v === S.speed}">${v}×</button>`).join(''); $('#bSkip').setAttribute('aria-pressed', S.skip); }
$('#speed').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; S.speed = Number(b.dataset.v); store.set('replay.speed', S.speed); paintSpeed(); });
$('#bSkip').addEventListener('click', () => { S.skip = !S.skip; store.set('replay.skip', S.skip ? '1' : '0'); paintSpeed(); });
$('#bReload').addEventListener('click', () => { const was = S.playing; setPlaying(false); load(true).then(() => { if (was && S.root) play(); }); });
function syncUrl() { if (!S.root) return; const u = new URL(location.href); u.searchParams.set('task', S.root.id); u.searchParams.set('at', Math.round((S.T - S.t0) / 1000)); u.searchParams.delete('play'); history.replaceState(null, '', u.pathname + u.search); }
$('#bLink').addEventListener('click', async () => { const u = new URL(location.href); u.searchParams.delete('token'); let ok = false; try { await navigator.clipboard.writeText(u.href); ok = true; } catch {} $('#linkT').textContent = ok ? 'コピーしました' : 'URLを選んでコピー'; setTimeout(() => { $('#linkT').textContent = 'リンク'; }, 1800); });
addEventListener('keydown', (e) => {
  if (!S.root || e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const onTrack = e.target === track;
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); S.playing ? setPlaying(false) : play(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setPlaying(false); if (onTrack) seek(S.T - (e.shiftKey ? 10000 : 1000)); else $('#bPrev').click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setPlaying(false); if (onTrack) seek(S.T + (e.shiftKey ? 10000 : 1000)); else $('#bNext').click(); }
  else if (e.key === 'Home') { e.preventDefault(); $('#bStart').click(); } else if (e.key === 'End') { e.preventDefault(); $('#bEnd').click(); }
  else if (e.key === ']' || e.key === '[') { const i = SPEEDS.indexOf(S.speed) + (e.key === ']' ? 1 : -1); if (SPEEDS[i]) { S.speed = SPEEDS[i]; store.set('replay.speed', S.speed); paintSpeed(); } }
  else if (e.key === 'c' || e.key === 'C') $('#bSkip').click();
});
paintSpeed(); $('#icPlay').innerHTML = IC.play;
load();
</script>
</body>
