<style>
/* Hallmark · shape: app screen (playback) · theme: Rim, shared with /beta and /wall · states: loading, locked, error, picker, empty, playing, paused, ended
 * signature: the lanes on a real-time axis, now scrubbable. The playhead is the only thing that moves; everything else is a pure function of the playhead time. */
:root {
  color-scheme: dark;
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem;
  --color-error: oklch(72% 0.15 27); --color-success: oklch(76% 0.13 150); --color-warn: oklch(80% 0.13 85);
  --color-paper: oklch(9% 0.008 75); --color-paper-2: oklch(12.5% 0.009 75); --color-paper-3: oklch(6.5% 0.007 75);
  --color-ink: oklch(94% 0.010 80); --color-ink-2: oklch(84% 0.011 80); --color-muted: oklch(68% 0.012 80); --color-muted-2: oklch(50% 0.010 80);
  --color-rule: oklch(25% 0.010 78); --color-rule-2: oklch(16% 0.009 78);
  --color-accent: oklch(72% 0.17 45); --color-accent-ink: oklch(10% 0.02 45); --color-focus: oklch(78% 0.15 45);
  --font-display: "Switzer", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top-h: 56px; --hit: 44px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--color-paper); }
body { color: var(--color-ink); font-family: var(--font-display); font-size: var(--text-md); line-height: 1.55; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: inherit; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3 { margin: 0; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }
p { margin: 0; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-width: 36px; min-height: 36px; padding: 0 var(--space-sm); border: 1px solid var(--color-rule); background: transparent; color: var(--color-ink-2); font-size: var(--text-sm); cursor: pointer; text-decoration: none; transition: background-color 0.12s, border-color 0.12s, transform 0.12s; }
.btn:hover { background: var(--color-paper-2); border-color: var(--color-muted-2); }
.btn:active { transform: scale(0.97); }
.btn[aria-pressed="true"] { color: var(--color-accent); border-color: var(--color-accent); }
.btn.pri { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); font-weight: 500; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.big { min-width: 52px; min-height: 52px; }
.btn.big .ic { width: 22px; height: 22px; }

.app { height: 100dvh; display: grid; grid-template-rows: var(--top-h) minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: var(--space-sm); padding: 0 var(--space-md); border-bottom: 1px solid var(--color-rule); min-width: 0; }
.top h1 { font-size: var(--text-md); white-space: nowrap; }
.top .sel { flex: 1; min-width: 0; max-width: 40rem; min-height: 36px; padding: 0 var(--space-sm); border: 1px solid var(--color-rule); background: var(--color-paper-2); text-overflow: ellipsis; }
.top .grow { flex: 1; }

.body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, 24rem); grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.stage { grid-column: 1; grid-row: 1; min-height: 0; overflow: auto; padding: var(--space-md); display: grid; gap: var(--space-sm); align-content: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); }
.log { grid-column: 2; grid-row: 1 / span 2; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--color-rule); background: var(--color-paper-3); }
.log h2 { padding: var(--space-sm) var(--space-md); font-size: var(--text-sm); color: var(--color-muted); border-bottom: 1px solid var(--color-rule-2); }
.log ol { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-xs) 0; scroll-behavior: auto; }
.ev { display: grid; grid-template-columns: 2.9rem 16px minmax(0, 1fr); gap: var(--space-xs); align-items: start; padding: 6px var(--space-md); font-size: var(--text-sm); color: var(--color-muted); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.ev:hover { background: var(--color-paper-2); }
.ev .tm { font-family: var(--font-mono); font-size: var(--text-xs); padding-top: 2px; color: var(--color-muted-2); }
.ev .ic { margin-top: 3px; color: var(--lc, var(--color-muted)); }
.ev .tx { overflow-wrap: anywhere; color: var(--color-ink-2); }
.ev .tx small { display: block; color: var(--color-muted); font-size: var(--text-xs); }
.ev[data-k="ask"] .tx { color: var(--color-accent); }
.ev[data-k="fail"] .tx { color: var(--color-error); }
.ev[data-last="1"] { background: var(--color-paper-2); box-shadow: inset 2px 0 0 var(--color-accent); }
.ev img { display: block; margin-top: 4px; max-width: 100%; max-height: 7rem; border: 1px solid var(--color-rule); }
.log .none { padding: var(--space-lg) var(--space-md); color: var(--color-muted-2); font-size: var(--text-sm); }

.lane { position: relative; display: flex; flex-direction: column; gap: var(--space-xs); padding: var(--space-md) var(--space-md) var(--space-md) calc(var(--space-md) + 4px); border: 1px solid var(--color-rule); background: var(--color-paper-2); min-width: 0; overflow: hidden; }
.lane::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--lc); }
.lane[data-st="pending"] { opacity: 0.45; }
.lane[data-st="done"]::before, .lane[data-st="cancelled"]::before { background: var(--color-muted-2); } .lane[data-st="failed"]::before { background: var(--color-error); }
.lane[data-ask="1"] { border-color: var(--color-accent); }
.lw { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; }
.av { flex: none; width: 36px; height: 36px; display: grid; place-items: center; background: var(--color-paper-3); border: 1px solid var(--color-rule); font-weight: 500; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.lw .n { flex: 1; min-width: 0; } .lw .n b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lw .n span { display: block; font-size: var(--text-xs); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lw .s { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.lane[data-st="running"] .lw .s { color: var(--color-ink-2); }
.lane .nowt { display: flex; align-items: flex-start; gap: var(--space-xs); font-size: clamp(1.2rem, 2.4vw, 2.2rem); font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; overflow-wrap: anywhere; min-height: 2.6em; }
.lane .nowt .ic { margin-top: 0.3em; width: 1em; height: 1em; color: var(--lc); }
.lane[data-st="done"] .nowt, .lane[data-st="pending"] .nowt { color: var(--color-muted); }
.lane .cnt { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-muted); display: flex; justify-content: space-between; }
.lane .ask { display: flex; gap: var(--space-xs); padding: var(--space-xs) var(--space-sm); background: var(--color-accent); color: var(--color-accent-ink); font-size: var(--text-sm); font-weight: 500; }
.lane .ask .ic { margin-top: 3px; }

.dock { grid-column: 1; grid-row: 2; border-top: 1px solid var(--color-rule); background: var(--color-paper); padding: var(--space-sm) var(--space-md) max(var(--space-md), env(safe-area-inset-bottom)); display: grid; gap: var(--space-sm); }
.track { position: relative; height: var(--th, 120px); border: 1px solid var(--color-rule); background: var(--color-paper-3); cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; }
.track canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.track .head { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; background: var(--color-accent); pointer-events: none; will-change: transform; }
.track .head::before { content: ""; position: absolute; top: 0; left: -5px; width: 12px; height: 8px; background: var(--color-accent); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.track:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.tip { position: absolute; z-index: 5; pointer-events: none; max-width: 22rem; padding: 4px 8px; border: 1px solid var(--color-rule); background: var(--color-paper-2); font-size: var(--text-xs); color: var(--color-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); }
.ctls .time { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-ink-2); min-width: 9.5em; }
.ctls .time small { color: var(--color-muted); }
.ctls .grow { flex: 1; }
.speed { display: inline-flex; border: 1px solid var(--color-rule); }
.speed button { min-width: 40px; min-height: 36px; padding: 0 8px; border: 0; background: none; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-muted); cursor: pointer; }
.speed button + button { border-left: 1px solid var(--color-rule); }
.speed button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-accent-ink); }
.speed button:hover:not([aria-pressed="true"]) { background: var(--color-paper-2); }

.state { grid-row: 2; display: grid; place-content: center; justify-items: center; gap: var(--space-md); padding: var(--space-xl) var(--space-md); text-align: center; }
.state h2 { font-size: var(--text-xl); } .state p { color: var(--color-muted); max-width: 44ch; }
.state input { width: min(24rem, 86vw); min-height: 44px; padding: 0 var(--space-md); border: 1px solid var(--color-rule); background: var(--color-paper-3); }
.picker { width: min(46rem, 94vw); border-top: 1px solid var(--color-rule); text-align: left; }
.picker a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-md); padding: var(--space-sm) var(--space-xs); border-bottom: 1px solid var(--color-rule); text-decoration: none; }
.picker a:hover { background: var(--color-paper-2); }
.picker .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-ink-2); }
.picker .m { font-size: var(--text-xs); color: var(--color-muted); } .picker .d { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-muted); text-align: right; }
.picker a[data-st="failed"] .m b { color: var(--color-error); font-weight: 400; }

@media (max-width: 62rem) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto minmax(0, 14rem); }
  .log { grid-column: 1; grid-row: 3; border-left: 0; border-top: 1px solid var(--color-rule); }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .top h1 { display: none; }
}
@media (max-width: 30rem) { .ctls .time small { display: none; } .ctls .time { min-width: 0; } .speed button { min-width: 34px; padding: 0 5px; } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div class="app">

  </header>
  <div class="body" id="body" hidden>

        <button class="btn" id="bPrev" type="button" aria-label="ひとつ前の出来事へ" title="ひとつ前の出来事 (←)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>

        <button class="btn" id="bEnd" type="button" aria-label="最後へ" title="最後へ (End)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg></button>
        <span class="time" id="time" aria-live="off"></span>
        <span class="grow"></span>
        <button class="btn" id="bSkip" type="button" aria-pressed="true" title="何も起きていない間を早送りする (C)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg><span>待ち時間を詰める</span></button>

const S = { token: store.get('token', ''), snap: null, root: null, tasks: [], steps: [], events: [], agents: [], lanes: new Map(), t0: 0, t1: 1, T: 0, playing: false, speed: Number(store.get('replay.speed', '4')), skip: store.get('replay.skip', '1') === '1', shown: 0, laneKey: '' };

/* ---------- load ---------- */
const url = new URL(location.href);
const qt = url.searchParams.get('token'); if (qt) { S.token = qt; store.set('token', qt); url.searchParams.delete('token'); history.replaceState(null, '', url.pathname + url.search + url.hash); }
async function fetchSnap() {

function showState(h, p, extra = '') { $('#body').hidden = true; const s = $('#state'); s.hidden = false; s.innerHTML = `<h2>${esc(h)}</h2>${p ? `<p>${esc(p)}</p>` : ''}${extra}`; }

  if (!root) return showState('このセッションは読み込めません', '直近20件より前の記録は、リプレイの対象外です。', `<a class="btn" href="/replay">一覧から選ぶ</a>`);

}
$('#sel').addEventListener('change', (e) => { if (e.target.value) location.href = `/replay?task=${e.target.value}&play=1`; });
function picker(roots) {
  S.playing = false;
  const agentN = (id) => (S.snap.agents.find((a) => a.id === id) || {}).name || id || 'AI';
  if (!roots.length) return showState('リプレイできる記録がありません', 'AIの作業が記録されると、ここから巻き戻して見られます。');
  showState('リプレイするセッションを選んでください', '直近のセッションを新しい順に並べています。', `<nav class="picker" aria-label="セッション一覧">${roots.map((t) => `<a href="/replay?task=${t.id}&play=1" data-st="${esc(t.status)}"><span class="t">${esc(t.title)}</span><span class="d">${fmt((t.finishedAt || t.updatedAt) - t.startedAt)}</span><span class="m">${esc(agentN(t.agent))} · <b>${esc(ST[t.status] || t.status)}</b> · ${new Date(t.startedAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span><span class="m" style="text-align:right">${(t.steps || []).length} ステップ</span></a>`).join('')}</nav>`);
}

/* ---------- build the event model for one session ---------- */
function build(root, keepPos) {

  const agentOf = (id) => id || root.agent || 'AI';

      ev.push({ at: s.createdAt, k: 'step', agent: agentOf(s.agent || t.agent), text: s.title, kind: s.kind, icon: s.kind, label: KL[s.kind] || '' });
      if (s.endedAt && s.status === 'failed') ev.push({ at: s.endedAt, k: 'fail', agent: agentOf(s.agent || t.agent), text: `失敗: ${s.title}`, icon: 'fix' });

  }

    if (a.answeredAt) ev.push({ at: a.answeredAt, k: 'answer', agent: 'user', text: `回答: ${a.answer || '(回答)'}`, sub: a.comment || '', icon: 'msg' });

/* ---------- state at time T ---------- */
function laneAt(agent, T) {

const agentRow = (id) => S.snap.agents.find((a) => a.id === id) || { id, name: id };

/* ---------- paint ---------- */

  $('#time').innerHTML = `${fmt(T - S.t0)} / ${fmt(span)} <small>${wallClock(T)}</small>`;
  const tr = $('#track'); tr.setAttribute('aria-valuenow', Math.round(((T - S.t0) / span) * 100)); tr.setAttribute('aria-valuetext', `${fmt(T - S.t0)}(全体 ${fmt(span)})`);

}
function paintLanes(force) {

}
function paintLog(force) {
  const T = S.T, ev = S.events; let n = 0; { let lo = 0, hi = ev.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (ev[mid].at <= T) lo = mid + 1; else hi = mid; } n = lo; }

  const from = Math.max(0, n - 300);
  const item = (e, i) => `<li><button class="ev" type="button" data-i="${i}" data-k="${e.k}" style="--lc:${colorOf(e.agent)}" aria-label="この時点へ移動"><span class="tm">${fmt(e.at - S.t0)}</span>${ic(e.icon)}<span class="tx">${e.who ? `<small>${esc(e.who)}</small>` : ''}${e.label ? `<small>${esc(agentRow(e.agent).name || e.agent)} · ${esc(e.label)}</small>` : ''}${esc(e.text)}${e.sub ? `<small>${esc(e.sub)}</small>` : ''}${e.shot ? `<img alt="" loading="lazy" src="/api/shot?id=${e.shot}${S.token ? '&token=' + encodeURIComponent(S.token) : ''}">` : ''}</span></button></li>`;

$('#log').addEventListener('click', (e) => { const b = e.target.closest('.ev'); if (!b) return; const ev = S.events[Number(b.dataset.i)]; if (ev) { setPlaying(false); seek(ev.at); } });

/* ---------- timeline canvas ---------- */
const cv = $('#cv'), track = $('#track'); let dpr = 1, W = 0, H = 0;
const trackW = () => W || track.clientWidth;
function sizeTrack() {
  const rows = S.agents.length, rowH = 22, ruler = 22;
  track.style.setProperty('--th', Math.min(260, Math.max(96, ruler + rows * (rowH + 6) + 10)) + 'px');
  dpr = Math.min(2, window.devicePixelRatio || 1); W = track.clientWidth; H = track.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
function drawTrack() {

  g.font = '11px "Geist Mono", ui-monospace, monospace'; g.textBaseline = 'middle';
  const nice = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400].map((s) => s * 1000); const step = nice.find((n) => span / n <= Math.max(3, W / 90)) || nice[nice.length - 1];

addEventListener('resize', () => { if (!S.root) return; sizeTrack(); paint(false); });

/* ---------- scrubbing ---------- */
let drag = false;
const posToTime = (clientX) => { const r = track.getBoundingClientRect(); return S.t0 + Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * (S.t1 - S.t0); };
track.addEventListener('pointerdown', (e) => { drag = true; wasPlaying = S.playing; setPlaying(false); track.setPointerCapture(e.pointerId); seek(posToTime(e.clientX)); });
let wasPlaying = false;
track.addEventListener('pointermove', (e) => {
  if (drag) { seek(posToTime(e.clientX)); return; }
  const r = track.getBoundingClientRect(), t = posToTime(e.clientX), row = Math.floor((e.clientY - r.top - 26) / 28), id = S.agents[row];
  const hit = id && S.steps.find((s) => s.agent === id && s.createdAt <= t && t < s.visEnd);
  const tip = $('#tip'); if (hit) { tip.hidden = false; tip.textContent = `${KL[hit.kind] || ''} · ${hit.title}`; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, e.clientX - r.left + 10)) + 'px'; tip.style.top = Math.max(2, e.clientY - r.top - 30) + 'px'; } else tip.hidden = true;

const endDrag = () => { if (!drag) return; drag = false; if (wasPlaying && S.T < S.t1) play(); };

/* ---------- playback ---------- */

  S.T = Math.min(S.t1, S.T + dt * rate);
  paint(false);
  if (S.T >= S.t1) { setPlaying(false); $('#bPlay').setAttribute('aria-label', 'もう一度再生'); return; }
  raf = requestAnimationFrame(tick);
}
$('#bPlay').addEventListener('click', () => (S.playing ? setPlaying(false) : play()));
$('#bStart').addEventListener('click', () => { setPlaying(false); seek(S.t0); });
$('#bEnd').addEventListener('click', () => { setPlaying(false); seek(S.t1); });
$('#bNext').addEventListener('click', () => { const e = nextEvent(); setPlaying(false); seek(e ? e.at : S.t1); });
$('#bPrev').addEventListener('click', () => { const e = prevEvent(); setPlaying(false); seek(e ? e.at : S.t0); });
function paintSpeed() { $('#speed').innerHTML = SPEEDS.map((v) => `<button type="button" data-v="${v}" aria-pressed="${v === S.speed}">${v}×</button>`).join(''); $('#bSkip').setAttribute('aria-pressed', S.skip); }
$('#speed').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; S.speed = Number(b.dataset.v); store.set('replay.speed', S.speed); paintSpeed(); });
$('#bSkip').addEventListener('click', () => { S.skip = !S.skip; store.set('replay.skip', S.skip ? '1' : '0'); paintSpeed(); });
$('#bReload').addEventListener('click', () => { const was = S.playing; setPlaying(false); load(true).then(() => { if (was && S.root) play(); }); });
function syncUrl() { if (!S.root) return; const u = new URL(location.href); u.searchParams.set('task', S.root.id); u.searchParams.set('at', Math.round((S.T - S.t0) / 1000)); u.searchParams.delete('play'); history.replaceState(null, '', u.pathname + u.search); }
$('#bLink').addEventListener('click', async () => { const u = new URL(location.href); u.searchParams.delete('token'); let ok = false; try { await navigator.clipboard.writeText(u.href); ok = true; } catch {} $('#linkT').textContent = ok ? 'コピーしました' : 'URLを選んでコピー'; setTimeout(() => { $('#linkT').textContent = 'リンク'; }, 1800); });
addEventListener('keydown', (e) => {
  if (!S.root || e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const onTrack = e.target === track;
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); S.playing ? setPlaying(false) : play(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setPlaying(false); if (onTrack) seek(S.T - (e.shiftKey ? 10000 : 1000)); else $('#bPrev').click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setPlaying(false); if (onTrack) seek(S.T + (e.shiftKey ? 10000 : 1000)); else $('#bNext').click(); }
  else if (e.key === 'Home') { e.preventDefault(); $('#bStart').click(); } else if (e.key === 'End') { e.preventDefault(); $('#bEnd').click(); }
  else if (e.key === ']' || e.key === '[') { const i = SPEEDS.indexOf(S.speed) + (e.key === ']' ? 1 : -1); if (SPEEDS[i]) { S.speed = SPEEDS[i]; store.set('replay.speed', S.speed); paintSpeed(); } }
  else if (e.key === 'c' || e.key === 'C') $('#bSkip').click();
});
paintSpeed(); $('#icPlay').innerHTML = IC.play;
load();
</script>
